    profile: community-local
    status: NOT_CLAIMED
    source: docs/local-security-profile.md
  - id: second_maintainer_independent_review
    profile: community-local
    status: NOT_CLAIMED
    source: docs/security-release-governance.md
  - id: remote_worm_audit_sink
    profile: community-local
    status: RESIDUAL
    source: docs/security-release-governance.md
  - id: native_platform_authority_evidence
    profile: community-local
    status: BLOCKED_EXTERNAL
    source: docs/security-release-governance.md
