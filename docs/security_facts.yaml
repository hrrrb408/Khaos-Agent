schema_version: 1
authority:
  long_lived_grant: AuthorityGrant
  compatibility_grant_class: AuthorityEnvelope
  short_lived_effect: EffectCapability
  receipt_ttl_seconds: 300
  receipt_states:
    - prepared
    - claimed
    - success
    - failed
    - unknown
    - expired
    - revoked
  expiry_semantics: expiry_blocks_new_claims_but_not_result_commit_after_claim
  pending_receipt_gc: bounded_with_per_principal_and_global_quotas
  local_audit_role: diagnostic_forensics_only
  remote_worm_role: independent_effect_authorization_evidence
  authorityd_policy_scope: issuer_policy_digest_typed_resource_and_operation_action_gate
  full_effect_policy_scope: agent_runtime_and_workspace_authorities
linux:
  sandbox_backend: bubblewrap_plus_native_launcher_and_cgroup
  job_identity: dedicated_user_namespace_uid
  job_uid_contract: KHAOS_JOB_UID
  job_uid_mapping: bwrap_unshare_user_uid_gid
  host_uid_distinction: not_claimed_without_native_host_mapping_proof
  identity_oracle: proc_status_uid_map_gid_map
  docker_outer_profile: hash_pinned_operator_supplied_seccomp_apparmor_systempaths_manifest
  docker_ci_outer_profile: unconfined_for_disposable_composition_probe_only
  docker_execution_cgroup: delegated_v2_subtree_required_for_agent_uid_10001
  docker_execution_cgroup_parent: required_parent_of_agent_service_cgroup
  docker_agent_sys_admin: forbidden
  docker_execution_launcher: capability_free_dedicated_copy
  browser_authority_launcher: separate_cap_sys_admin_transition_only
  production_dev_mode_fallback: forbidden
platform_boundaries:
  authority_profile_selector: python/khaos/security/authority_transport.py
  macos_authority_transport: community_private_unix_default_or_explicit_native_launchd_xpc
  macos_community_boundary: same_user_kernel_peer_uid_private_socket_no_team_id_claim
  community_local_trust_root: ~/.khaos/authorityd
  community_local_trust_chain:
    - local_user_runtime_identity
    - owner_only_trusted_state_directory
    - protected_local_capability_and_af_unix_peer_uid
    - runtime_authority
    - local_ed25519_authority_key
    - effective_policy_and_typed_catalog_digest
    - approval_verification_and_audit
  community_authority_paths: socket_key_public_key_catalog_local_audit_must_be_owner_held_no_symlink_descendants
  community_socket_mode: "0600"
  community_receipt_verification: client_verifies_against_published_ed25519_key
  community_apple_signing_requirement: not_required
  community_same_uid_residual: explicit_profile_boundary_not_multi_user_or_code_signing_isolation
  macos_native_boundary: launchd_xpc_requires_explicit_native_production_profile_and_team_id
  macos_signed_distribution_profile: optional_native_production_team_id_certificate_keychain_launchd_xpc_notarization
  macos_signed_distribution_disabled_status: optional_profile_not_enabled_or_not_certified
  profile_status_vocabulary:
    - pass
    - fail
    - blocked_external
    - not_applicable
    - not_run
    - optional_profile_not_enabled
  local_closure_status_vocabulary:
    - CLOSED
    - NOT_CLOSED
    - BLOCKED_EXTERNAL
    - NOT_APPLICABLE
    - NOT_RUN
    - OPTIONAL_PROFILE_NOT_ENABLED
    - REJECTED
    - UNKNOWN
    - NOT_CLAIMED
  windows_authority_transport: native_named_pipe_service_sid_adapter_required
  macos_native_client: packaging/macos/khaos-authorityd-xpc-client.c
  macos_native_service: packaging/macos/khaos-authorityd-xpc.m
  macos_key_boundary: launchd_authority_user_plus_keychain_access_group
  windows_native_service: rust/khaos-core/src/bin/khaos-authorityd-windows.rs
  windows_key_boundary: service_sid_plus_dpapi_protected_key
  unsupported_platform_behavior: fail_closed
effect_boundaries:
  git_worktree_paths: strict_descendant_of_trusted_git_runner_authority_root
  git_apply_patch_binding: sha256_and_length_rechecked_before_spawn
  narrow_abort_reason: exact_planned_event_reason_is_committed
  credential_owner: short_lived_broker_lease_with_target_operation_policy_principal_binding
  credential_secret_visibility: trusted_final_execution_environment_only
shell_boundaries:
  terminal_argv_contract: exact_argv_without_shell_expansion
  terminal_shell_parser: python/khaos/security/shell_semantics.py
  terminal_shell_safe_status: literal_ast_with_argv_semantic_policy_only
  terminal_shell_unknown_status: semantic-unknown_requires_approval
  terminal_shell_ast_binding: script_digest_plus_semantic_digest
principal_boundaries:
  kinds:
    - human
    - gateway
    - channel
    - automation
    - subagent
    - browser
  transport_derivation: RequestContext_derives_principal_kind_from_authenticated_source_transport
  delegation: DelegationScope_is_narrow_only_and_binds_principal_parent_project_session_runtime_task_workspace_operation_resource_policy_expiry_nonce
  replay: DelegationAuthority_consumes_each_child_scope_once_and_rejects_cross_principal_or_context_replay
production_reachability:
  roots:
    - khaos.rpc.agent_service:AgentService
    - khaos.grpc_server:_dispatch
    - khaos.runtime.factory:build_production_runtime
    - khaos.tools.scheduler:ToolScheduler
    - khaos.coding.execution.service:ExecutionService
  generator: scripts/generate_production_reachability.py
  forbidden_modules:
    - khaos.coding.execution.host
    - khaos.coding.verification.pipeline
    - khaos.runtime.testing
    - khaos.security.mock_authority
    - khaos.coding.execution.testing_sandbox
  forbidden_components:
    - HostExecutionBackend
    - HostBackend
    - mock authority
    - testing sandbox
    - injectable development security composition
  unresolved_internal_imports: fail_closed
  generated_artifact: docs/generated/production-reachability.md
  evidence_class: machine_checked_repository_graph_not_native_kernel_evidence
runtime_profile:
  type: python/khaos/runtime_profile.py:RuntimeProfile
  values:
    - production
    - development
    - testing
  production_builder: build_production_runtime_fixes_production_profile
  legacy_environment: KHAOS_DEV_MODE_is_only_a_compatibility_resolver_input
  ambient_security_authority: forbidden_outside_legacy_profile_resolver
  production_entrypoints:
    - python/khaos/cli/main.py
    - python/khaos/grpc_server.py
    - python/khaos/rpc/agent_service.py
    - scripts/verify_production_composition.py
deployment_profiles:
  community_local:
    identifier: community-local
    default: true
    decision_owner: python/khaos/security/local_closure.py
    machine_decision_status: CLOSED_or_NOT_CLOSED
    exact_main_push_ci_required: true
    apple_signing_prerequisite: not_required
  macos_signed_distribution:
    identifier: macos-signed-distribution
    enabled_by: KHAOS_NATIVE_MACOS_E2E
    disabled_status: OPTIONAL_PROFILE_NOT_ENABLED
    missing_native_evidence: fail_closed
  windows_native:
    identifier: windows-native
    status: native_or_fail_closed
    missing_native_evidence: fail_closed
closure_semantics:
  live_authority: scripts/verify_release_gate_runs.py
  saved_release_record_is_capability: false
  exact_commit_required: true
  original_run_attempt_required: 1
  protected_main_ancestry_required: true
  community_local_decision_is_profile_scoped: true
required_gates:
  merge_authority:
    - Security Closure Gate
    - Product Integrity Gate
  security_closure_workflow: .github/workflows/security-closure-gate.yml
  product_integrity_workflow: .github/workflows/product-integrity-gate.yml
  community_local_provenance_workflow: .github/workflows/community-local-closure.yml
  release_verifier: scripts/verify_release_gate_runs.py
  exact_push_event: push
  exact_main_ref: refs/heads/main
required_proof_names:
  community_local:
    - community_authority
    - platform_kernel
    - production_reachability
    - production_composition
    - workspace_escape
    - approval_replay
    - approval_substitution
    - process_tree_escape
    - resource_owner_closure
    - network_isolation
accepted_residuals:
