  hard_gate: true
  additional_coverage_mode: basic
  validator: scripts/validate_type_check_contract.py
issue_169:
  tracker: "#169"
  overall_status: PARTIALLY_COMPLETED
  do_not_close_from_local_evidence: true
  classification_vocabulary:
    - COMPLETED
    - PARTIALLY_COMPLETED
    - RESIDUAL
    - DEFERRED
    - OUT_OF_PROFILE
  items:
    typed_resource_narrowing:
      status: COMPLETED
      evidence:
        - python/khaos/security/resource_scope.py
        - python/tests/security/test_resource_scope.py
    grant_descendants:
      status: COMPLETED
      evidence:
        - python/khaos/security/authorityd.py
        - python/tests/security/test_authorityd_protocol.py
    immutable_scheduler_states:
      status: PARTIALLY_COMPLETED
      evidence:
        - python/khaos/tools/admission.py
        - python/khaos/security/orchestration_phases.py
        - python/tests/security/test_tool_scheduler_state_contract.py
      residual: mutable_compatibility_projection_and_incremental_physical_split
    native_authority:
      status: PARTIALLY_COMPLETED
      evidence:
        - python/khaos/security/native_authority.py
        - .github/workflows/native-authority-production-e2e.yml
        - python/tests/security/test_native_authority.py
      residual: exact_sha_native_platform_ci_and_deployment_identity
    delegation:
      status: COMPLETED
      evidence:
        - python/khaos/security/delegation_issuer.py
        - python/khaos/security/authorityd.py
        - python/tests/security/test_delegation_authority_owned.py
      residual: live_deployment_transport_remains_fail_closed_when_unavailable
tool_scheduler_state_machine:
  status: incremental_typed_boundary_already_present
  canonical_immutable_states:
    admitted_tool_call: python/khaos/tools/admission.py:AdmittedToolCall
    phase_evidence: python/khaos/security/orchestration_phases.py:ToolPhaseSnapshot
    approval_bound_call: python/khaos/agent/approval.py:ApprovalBinding
    authorized_effect: python/khaos/agent/approval.py:StepExecutionAuthority
    resolved_execution: python/khaos/coding/execution/models.py:ResolvedExecutionContext
  phase_order:
    - raw
    - validated
    - resource_resolved
    - permission_decided
    - approval_bound
    - authorized_effect
    - dispatching
    - terminal
  compatibility_projection: python/khaos/tools/scheduler.py:mutable_call_metadata_rechecked_against_canonical_states
  mutation_fail_closed_tests:
    - python/tests/tools/test_scheduler_boundaries.py
    - python/tests/security/test_orchestration_phases.py
