services:
  khaos-agent-init:
    build:
      context: .
      target: python-agent
    container_name: khaos-agent-init
    user: "0:0"
    entrypoint: ["python", "/usr/local/sbin/khaos-agent-secret-init.py"]
    environment:
      - KHAOS_PYTHON_CAPABILITY_FILE=/run/secrets/khaos_python_capability
    secrets:
      - khaos_python_capability
    volumes:
      - khaos-state:/var/lib/khaos
    restart: "no"

  khaos-agent:
    build:
      context: .
      target: python-agent
    container_name: khaos-agent
    volumes:
      - khaos-data:/app/data
      - khaos-state:/var/lib/khaos
      - khaos-runtime:/run/khaos
      - khaos-helper-runtime:/run/khaos-helper:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - KHAOS_MODE=office
      - KHAOS_DEV_MODE=0
      - KHAOS_PROJECT_ROOT=/app
      - KHAOS_SANDBOX_LAUNCHER=/usr/local/bin/khaos-sandbox-launcher
      - KHAOS_EXECUTION_SANDBOX_LAUNCHER=/usr/local/bin/khaos-execution-sandbox-launcher
      - KHAOS_BROWSER_KERNEL_HELPER_SOCKET=/run/khaos-helper/browser-kernel-helper.sock
      - KHAOS_PYTHON_CAPABILITY_FILE=/var/lib/khaos/rpc-capability
    depends_on:
      khaos-agent-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/khaos/agent.sock'); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  khaos-kernel-helper:
    build:
      context: .
      target: kernel-helper
    container_name: khaos-kernel-helper
    user: "0:0"
    pid: "service:khaos-agent"
    network_mode: "service:khaos-agent"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - KHAOS_BROWSER_KERNEL_HELPER_UID=10001
      - KHAOS_BROWSER_KERNEL_HELPER_CLIENT_PID=1
      - KHAOS_BROWSER_KERNEL_HELPER_SOCKET=/run/khaos-helper/browser-kernel-helper.sock
      - KHAOS_BROWSER_HELPER_SECRET_FILE=/var/lib/khaos/browser-helper.secret
      - KHAOS_BROWSER_HELPER_JOURNAL_ROOT=/run/khaos-helper/journal
      - KHAOS_BROWSER_HELPER_NETNS_ROOT=/run/khaos-helper/netns
      - KHAOS_BROWSER_HELPER_CGROUP_ROOT=/run/khaos-helper/cgroup
    secrets:
      - khaos_browser_helper_secret
    volumes:
      - khaos-helper-runtime:/run/khaos-helper
      # The helper only owns its cgroup subtree; mounting the host cgroup
      # root read-write would give a compromised helper a wider TCB.
      # The target is outside the container's read-only /sys mount. The host
      # source must already be a cgroup v2 subtree; the helper rejects a
      # normal directory and fails closed.
      - "${KHAOS_BROWSER_HELPER_CGROUP_SOURCE:-/sys/fs/cgroup/khaos-browser}:/run/khaos-helper/cgroup:rw"
      # Keep namespace handles in a helper-only volume instead of exposing
      # the host's complete /run/netns directory to the privileged helper.
      - khaos-helper-netns:/run/khaos-helper/netns
    depends_on:
      khaos-agent:
        condition: service_started
    restart: unless-stopped

  khaos-gateway:
    build:
      context: .
      target: gateway
    container_name: khaos-gateway
    # The default Compose path is local development.  Host networking lets
    # the Gateway bind to loopback inside its namespace while still sharing
    # the Agent's Unix-socket volume; publishing 0.0.0.0 would contradict the
    # Gateway's no-TLS-on-non-loopback security contract.
    network_mode: host
    command: ["khaos-gateway", "--addr", "127.0.0.1:8080", "--project-root", "/app"]
    depends_on:
      khaos-agent:
        condition: service_healthy
    environment:
      - KHAOS_PYTHON_AGENT=/run/khaos/agent.sock
      - KHAOS_API_KEY_FILE=/run/secrets/khaos_api_key
      - KHAOS_PROJECT_ROOT=/app
      - KHAOS_PYTHON_CAPABILITY_FILE=/run/secrets/khaos_python_capability
    secrets:
      - source: khaos_python_capability
        target: khaos_python_capability
        mode: "0440"
      - source: khaos_api_key
        target: khaos_api_key
        mode: "0440"
    volumes:
      - khaos-runtime:/run/khaos:ro
    group_add:
      - "0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  khaos-data:
  khaos-state:
  khaos-runtime:
  khaos-helper-runtime:
  khaos-helper-netns:

secrets:
  khaos_python_capability:
    file: ${KHAOS_PYTHON_CAPABILITY_FILE:-.secrets/python-capability}
  khaos_browser_helper_secret:
    file: ${KHAOS_BROWSER_HELPER_SECRET_FILE:-.secrets/browser-helper-secret}
  khaos_api_key:
    file: ${KHAOS_API_KEY_FILE:-.secrets/gateway-api-key}
