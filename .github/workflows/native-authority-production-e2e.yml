name: Native Authority Production E2E

# M6.9 BATCH 6: real provisioning, not assumed state.
# - macOS: CI keychain + real codesign identity, a dedicated authority
#   user/group, signed frontend/backend binaries, a launchd frontend AND a
#   launchd authority backend, a real TLS WORM receiver, both the identity
#   probe and the full transaction E2E, artifacts bound to GITHUB_SHA and
#   GITHUB_RUN_ID.
# - Windows: real SCM service with a Service SID, DPAPI marker provisioned
#   under the SYSTEM identity, backend Named-Pipe service, both probes,
#   bound artifacts.
# The community profile does not require Apple signing material.  The macOS
# native job is therefore opt-in through the repository variable
# ``KHAOS_NATIVE_MACOS_E2E=true``; when it is not enabled, the workflow remains
# successful; the native release-gate verifier permits the macOS artifact to
# be absent. The profile-results job below emits the machine-readable
# deployment-profile status; it does not turn a missing signed artifact into
# a signed PASS.
# If the variable is enabled and the required secrets/runners are unavailable,
# the native job still FAILS rather than manufacturing evidence.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-authority-production-e2e
  cancel-in-progress: false

jobs:
  native-profile:
    name: Resolve native deployment profile
    runs-on: ubuntu-24.04
    outputs:
      macos_enabled: ${{ steps.profile.outputs.macos_enabled }}
    steps:
      - id: profile
        env:
          ENABLED: ${{ vars.KHAOS_NATIVE_MACOS_E2E }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo 'macOS native authority E2E is enabled'
            echo 'macos_enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'macOS native authority E2E is not enabled; community profile remains the default'
            echo 'macos_enabled=false' >> "$GITHUB_OUTPUT"
          fi

  community-local-profile:
    name: Community Local Profile (no Apple signing)
    runs-on: ubuntu-24.04
    env:
      KHAOS_AUTHORITY_PROFILE: community
      KHAOS_DEV_MODE: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install contract dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
      - name: Run Community Local Profile security gate
        run: |
          PYTHONPATH=python uv run pytest -q \
            python/tests/security/test_local_trust.py \
            python/tests/security/test_authority_transport.py \
            python/tests/security/test_authorityd_protocol.py \
            python/tests/security/test_identity_isolation.py

  macos-launchd-xpc:
    name: macOS launchd/XPC authority
    needs: native-profile
    if: needs.native-profile.outputs.macos_enabled == 'true'
    runs-on: macos-14
    environment: security-native
    timeout-minutes: 40
    env:
      KHAOS_PRODUCER_JOB_NAME: macOS launchd/XPC authority
      KHAOS_TEAM_ID: ${{ secrets.KHAOS_MACOS_TEAM_ID }}
      KHAOS_AGENT_UID: "501"
      KHAOS_AUTHORITYD_UID: "505"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Verify required signing secrets
        run: |
          test -n "$KHAOS_TEAM_ID" || { echo 'KHAOS_MACOS_TEAM_ID secret is required' >&2; exit 1; }
          test -n "${{ secrets.KHAOS_MACOS_CODESIGN_CERTIFICATE }}" || { echo 'KHAOS_MACOS_CODESIGN_CERTIFICATE (base64 P12) secret is required' >&2; exit 1; }
      - name: Install contract dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
      - name: Provision CI keychain with the real signing identity
        env:
          KHAOS_CODESIGN_CERTIFICATE: ${{ secrets.KHAOS_MACOS_CODESIGN_CERTIFICATE }}
          KHAOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.KHAOS_MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN=khaos-ci.keychain-db
          PASSWORD=$(uuidgen)
          echo "$KHAOS_CODESIGN_CERTIFICATE" | base64 --decode > /tmp/khaos-ci-certificate.p12
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import /tmp/khaos-ci-certificate.p12 -k "$KEYCHAIN" \
            -P "$KHAOS_CODESIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f /tmp/khaos-ci-certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/valid identities/{print $2; exit}')
          test -n "$IDENTITY" || { echo 'no valid codesigning identity in CI keychain' >&2; exit 1; }
          echo "KHAOS_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Create the dedicated authority user and group
        run: |
          set -eu
          # PrimaryGroupID below names the group by GID: without a real
          # /Groups/khaos-authority record, chown user:group and launchd's
          # group resolution cannot resolve the identity.
          if ! dscl . -read /Groups/khaos-authority PrimaryGroupID >/dev/null 2>&1; then
            sudo dscl . -create /Groups/khaos-authority PrimaryGroupID 505
            sudo dscl . -create /Groups/khaos-authority RealName "Khaos Authority Service"
          fi
          if ! dscl . -read /Users/khaos-authority UniqueID >/dev/null 2>&1; then
            sudo dscl . -create /Users/khaos-authority UniqueID 505
            sudo dscl . -create /Users/khaos-authority PrimaryGroupID 505
            sudo dscl . -create /Users/khaos-authority UserShell /usr/bin/false
            sudo dscl . -create /Users/khaos-authority NFSHomeDirectory /var/db/khaos-authorityd
          fi
          sudo mkdir -p /var/db/khaos-authorityd /var/run/khaos-authorityd /etc/khaos
          sudo chown -R khaos-authority:khaos-authority /var/db/khaos-authorityd /var/run/khaos-authorityd
      - name: Build and sign the XPC service, backend wrapper, and client
        env:
          KHAOS_AGENT_CODE_SIGNATURE: com.khaos.agent
          KHAOS_NATIVE_PREFIX: ${{ github.workspace }}/native-bin
        run: packaging/macos/build-native-authority.sh
      - name: Provision the authority backend (key, catalog, WORM receiver)
        run: |
          set -eu
          POLICY_DIGEST=$(PYTHONPATH=python uv run python -c "from khaos.security.effective_policy import load_effective_policy; print(load_effective_policy('.').digest)")
          echo "KHAOS_EFFECTIVE_POLICY_DIGEST=$POLICY_DIGEST" >> "$GITHUB_ENV"
          # The Python generator owns the canonical catalog digest consumed
          # by authorityd; platform JSON serializers must not re-encode it.
          PYTHONPATH=python uv run python scripts/run_native_authority_e2e.py \
            --catalog-output /tmp/native-resource-catalog.json
          sudo install -o khaos-authority -g khaos-authority -m 0400 /tmp/native-resource-catalog.json /etc/khaos/native-resource-catalog.json
          # Create the Ed25519 authority key under the authority identity.
          sudo -u khaos-authority env \
            PYTHONPATH="$PWD/python" \
            KHAOS_AUTHORITYD_KEY_PATH=/var/db/khaos-authorityd/authorityd.pem \
            "$(command -v uv)" run --project . python -c \
            "from pathlib import Path; from khaos.security.authorityd_protocol import Ed25519KeyStore; Ed25519KeyStore.load_or_create(Path('/var/db/khaos-authorityd/authorityd.pem'), create=True)"
          # Publish the public key for the agent-side verifier.
          sudo -u khaos-authority env \
            PYTHONPATH="$PWD/python" \
            "$(command -v uv)" run --project . python -c \
            "from pathlib import Path; from khaos.security.authorityd_protocol import Ed25519KeyStore; k=Ed25519KeyStore.load_or_create(Path('/var/db/khaos-authorityd/authorityd.pem')); Path('/var/run/khaos-authorityd/authorityd.pub').write_bytes(k.public_key().public_bytes_raw())"
          sudo chmod 0644 /var/run/khaos-authorityd/authorityd.pub
      - name: Provision the protected-key Keychain item for the authority identity
        run: |
          set -eu
          # The XPC frontend fails closed unless a generic-password item with
          # account=khaos-authority-signing-key exists in the access group
          # its entitlement names.  The `security` CLI cannot set
          # kSecAttrAccessGroup, so the signed provisioner (same entitlements
          # as the frontend) creates the item.  The item is a random presence
          # marker: the attestation signing key stays the file Ed25519 key.
          AUTHORITY_HOME=/var/db/khaos-authorityd
          sudo -u khaos-authority mkdir -p "$AUTHORITY_HOME/Library/Keychains"
          if ! sudo -u khaos-authority env HOME="$AUTHORITY_HOME" security show-keychain-info "$AUTHORITY_HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1; then
            sudo -u khaos-authority env HOME="$AUTHORITY_HOME" security create-keychain -p "$(uuidgen)" "$AUTHORITY_HOME/Library/Keychains/login.keychain-db"
          fi
          sudo -u khaos-authority env HOME="$AUTHORITY_HOME" security list-keychains -d user -s "$AUTHORITY_HOME/Library/Keychains/login.keychain-db"
          sudo -u khaos-authority env HOME="$AUTHORITY_HOME" \
            /usr/local/libexec/khaos-authorityd-keychain-provision \
            khaos-authority-signing-key "${KHAOS_TEAM_ID}.com.khaos.authority"
      - name: Run a real TLS WORM audit receiver for the backend
        run: |
          set -eu
          # The production authorityd refuses to start without a remote
          # WORM endpoint.  CI runs a real HTTPS append-only receiver with
          # a runner-local CA installed into the system trust store: the
          # submission path is genuinely TLS-verified and fails closed.
          sudo security delete-trusted-cert -d /tmp/khaos-worm-ca.pem >/dev/null 2>&1 || true
          rm -f /tmp/khaos-worm-ca.pem /tmp/khaos-worm-receiver.log \
            /tmp/khaos-worm-receiver.err.log /tmp/khaos-worm-receiver.pid
          VENV_PY="$(uv run --project . which python)"
          PYTHONPATH="$PWD/python" nohup "$VENV_PY" \
            scripts/run_worm_audit_receiver.py \
            --port 8443 \
            --directory /tmp/khaos-worm-records \
            --emit-ca /tmp/khaos-worm-ca.pem \
            >/tmp/khaos-worm-receiver.log \
            2>/tmp/khaos-worm-receiver.err.log &
          WORM_PID=$!
          printf '%s\n' "$WORM_PID" > /tmp/khaos-worm-receiver.pid
          for _ in $(seq 1 40); do
            kill -0 "$WORM_PID" 2>/dev/null || {
              cat /tmp/khaos-worm-receiver.log /tmp/khaos-worm-receiver.err.log || true
              exit 1
            }
            test -f /tmp/khaos-worm-ca.pem && break
            sleep 0.5
          done
          test -s /tmp/khaos-worm-ca.pem || {
            cat /tmp/khaos-worm-receiver.log /tmp/khaos-worm-receiver.err.log || true
            echo 'WORM receiver did not emit its CA' >&2
            exit 1
          }
          chmod 0644 /tmp/khaos-worm-ca.pem
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/khaos-worm-ca.pem
          healthy=false
          for _ in $(seq 1 60); do
            kill -0 "$WORM_PID" 2>/dev/null || break
            status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --cacert /tmp/khaos-worm-ca.pem \
              --connect-timeout 2 --max-time 5 \
              https://127.0.0.1:8443/healthz || true)
            if [ "$status" = 204 ]; then healthy=true; break; fi
            sleep 0.5
          done
          if [ "$healthy" != true ]; then
            cat /tmp/khaos-worm-receiver.log /tmp/khaos-worm-receiver.err.log || true
            echo 'WORM receiver did not become healthy' >&2
            exit 1
          fi
          echo "KHAOS_AUDIT_WORM_ENDPOINT=https://127.0.0.1:8443/append" >> "$GITHUB_ENV"
          echo "KHAOS_AUDIT_WORM_CA_FILE=/tmp/khaos-worm-ca.pem" >> "$GITHUB_ENV"
      - name: Install the launchd frontend and authority backend
        env:
          KHAOS_AGENT_CODE_SIGNATURE: com.khaos.agent
        run: |
          set -eu
          sudo cp native-bin/khaos-authorityd-xpc /usr/local/libexec/khaos-authorityd-xpc
          sudo cp native-bin/khaos-authorityd-xpc-client /usr/local/libexec/khaos-authorityd-xpc-client
          sudo cp native-bin/khaos-authorityd-keychain-provision /usr/local/libexec/khaos-authorityd-keychain-provision
          # Backend wrapper runs the Python authority daemon under the
          # authority identity.
          VENV_PY="$(uv run --project . which python)"
          sudo sh -c "printf '%s\n' '#!/bin/sh' 'exec \"$VENV_PY\" -I -m khaos.security.authorityd_main' > /usr/local/bin/khaos-authorityd-backend"
          sudo chmod 0555 /usr/local/bin/khaos-authorityd-backend
          sudo sh -c "cat > /etc/khaos/native-authority.env" <<'ENVEOF'
          KHAOS_XPC_SERVICE=com.khaos.authorityd
          KHAOS_AUTHORITYD_XPC_SERVICE=com.khaos.authorityd
          KHAOS_AUTHORITYD_BACKEND_SOCKET=/var/run/khaos-authorityd/backend.sock
          KHAOS_AUTHORITYD_KEYCHAIN_GROUP=KHAOS_AUTHORITYD_KEYCHAIN_GROUP_PLACEHOLDER
          KHAOS_AUTHORITYD_PROTECTED_KEY_REF=khaos-authority-signing-key
          KHAOS_AGENT_UID=501
          KHAOS_AUTHORITYD_AGENT_CODE_SIGNATURE=com.khaos.agent
          KHAOS_AUTHORITYD_AGENT_CODE_REQUIREMENT=identifier "com.khaos.agent" and anchor apple generic and certificate leaf[subject.OU] = KHAOS_TEAM_ID_PLACEHOLDER
          KHAOS_AUTHORITYD_SERVICE_CODE_SIGNATURE=khaos-authorityd-xpc
          KHAOS_AUTHORITYD_SERVICE_CODE_REQUIREMENT=identifier "khaos-authorityd-xpc" and anchor apple generic and certificate leaf[subject.OU] = KHAOS_TEAM_ID_PLACEHOLDER
          ENVEOF
          sudo sed -i '' "s/KHAOS_AUTHORITYD_KEYCHAIN_GROUP_PLACEHOLDER/${KHAOS_TEAM_ID}.com.khaos.authority/" /etc/khaos/native-authority.env
          sudo sed -i '' "s/KHAOS_TEAM_ID_PLACEHOLDER/${KHAOS_TEAM_ID}/g" /etc/khaos/native-authority.env
          sudo chmod 0600 /etc/khaos/native-authority.env
          sudo chown root:wheel /etc/khaos/native-authority.env
          sudo cp packaging/macos/com.khaos.authorityd.plist /Library/LaunchDaemons/com.khaos.authorityd.plist
          PYTHONPATH=python uv run python scripts/render_macos_authority_backend_plist.py \
            --template packaging/macos/com.khaos.authorityd.backend.plist \
            --output /tmp/com.khaos.authorityd.backend.plist
          sudo cp /tmp/com.khaos.authorityd.backend.plist \
            /Library/LaunchDaemons/com.khaos.authorityd.backend.plist
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.khaos.authorityd.backend.plist
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.khaos.authorityd.plist
          sleep 5
          sudo launchctl print system/com.khaos.authorityd.backend | grep -q 'state = running'
          sudo launchctl print system/com.khaos.authorityd | grep -q 'state = running'
          test -S /var/run/khaos-authorityd/backend.sock
      - name: Run the native identity probe
        env:
          KHAOS_AUTHORITYD_LAUNCHD_SERVICE: com.khaos.authorityd
          KHAOS_AUTHORITYD_PROTECTED_KEY_REF: khaos-authority-signing-key
          KHAOS_AUTHORITYD_KEYCHAIN_GROUP: ${{ secrets.KHAOS_MACOS_TEAM_ID }}.com.khaos.authority
          KHAOS_AUTHORITYD_AGENT_CODE_SIGNATURE: com.khaos.agent
          KHAOS_AUTHORITYD_AGENT_CODE_REQUIREMENT: identifier "com.khaos.agent" and anchor apple generic and certificate leaf[subject.OU] = ${{ secrets.KHAOS_MACOS_TEAM_ID }}
          KHAOS_AUTHORITYD_PUBLIC_KEY_PATH: /var/run/khaos-authorityd/authorityd.pub
          KHAOS_MACOS_AUTHORITY_XPC_CLIENT: /usr/local/libexec/khaos-authorityd-xpc-client
        run: |
          set -eu
          mkdir -p native-evidence
          PYTHONPATH=python uv run python scripts/run_native_authority_identity_probe.py > /tmp/identity-proof.json
          test -s /tmp/identity-proof.json
      - name: Run the full authority transaction E2E
        env:
          KHAOS_AUTHORITY_PROFILE: native-production
          KHAOS_AUTHORITYD_LAUNCHD_SERVICE: com.khaos.authorityd
          KHAOS_AUTHORITYD_PROTECTED_KEY_REF: khaos-authority-signing-key
          KHAOS_AUTHORITYD_KEYCHAIN_GROUP: ${{ secrets.KHAOS_MACOS_TEAM_ID }}.com.khaos.authority
          KHAOS_AUTHORITYD_AGENT_CODE_SIGNATURE: com.khaos.agent
          KHAOS_AUTHORITYD_AGENT_CODE_REQUIREMENT: identifier "com.khaos.agent" and anchor apple generic and certificate leaf[subject.OU] = ${{ secrets.KHAOS_MACOS_TEAM_ID }}
          KHAOS_AUTHORITYD_PUBLIC_KEY_PATH: /var/run/khaos-authorityd/authorityd.pub
          KHAOS_TYPED_RESOURCE_CATALOG_PATH: /etc/khaos/native-resource-catalog.json
          KHAOS_MACOS_AUTHORITY_XPC_CLIENT: /usr/local/libexec/khaos-authorityd-xpc-client
          KHAOS_NATIVE_E2E_EFFECT_ROOT: /tmp/khaos-native-e2e-effects
        run: |
          set -eu
          PYTHONPATH=python uv run python scripts/run_native_authority_e2e.py --output /tmp/e2e-proof.json
          test -s /tmp/e2e-proof.json
      - name: Bind native evidence to this run
        run: |
          set -eu
          mkdir -p native-evidence
          PYTHONPATH=python uv run python - <<'EOF'
          import json, os
          from pathlib import Path
          policy = os.environ["KHAOS_EFFECTIVE_POLICY_DIGEST"]
          binding = {
              "github_sha": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "runner_os": "macOS",
              "proof_type": "macos-native-authority",
              "policy_digest": policy,
          }
          identity = json.loads(Path("/tmp/identity-proof.json").read_text())
          identity.update(binding)
          identity["platform"] = "darwin"
          Path("native-evidence/macos-xpc-proof.json").write_text(
              json.dumps(identity, sort_keys=True, separators=(",", ":"))
          )
          e2e = json.loads(Path("/tmp/e2e-proof.json").read_text())
          e2e.update(binding)
          Path("native-evidence/macos-xpc-e2e.json").write_text(
              json.dumps(e2e, sort_keys=True, separators=(",", ":"))
          )
          EOF
          test -s native-evidence/macos-xpc-proof.json
          test -s native-evidence/macos-xpc-e2e.json
          python - <<'EOF'
          import hashlib, json, os
          from pathlib import Path
          root = Path("native-evidence")
          files = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(root.iterdir())
              if path.is_file()
          }
          manifest = {
              "schema_version": 1,
              "proof_type": "macos-native-authority",
              "github_sha": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_name": "Native Authority Production E2E",
              "job_name": os.environ["KHAOS_PRODUCER_JOB_NAME"],
              "runner_os": "macOS",
              "runner_arch": os.uname().machine,
              "platform": "darwin",
              "policy_digest": os.environ["KHAOS_EFFECTIVE_POLICY_DIGEST"],
              "files": files,
          }
          (root / "proof-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          EOF
          test -s native-evidence/proof-manifest.json
      - name: Verify the signed binaries still satisfy the Team ID requirement
        run: |
          codesign --verify --strict --verbose=2 \
            -R="anchor apple generic and certificate leaf[subject.OU] = ${KHAOS_TEAM_ID}" \
            /usr/local/libexec/khaos-authorityd-xpc
          codesign --verify --strict --verbose=2 \
            -R="anchor apple generic and certificate leaf[subject.OU] = ${KHAOS_TEAM_ID}" \
            /usr/local/libexec/khaos-authorityd-xpc-client
      - name: Collect macOS native diagnostics
        if: always()
        run: |
          for log in \
            /tmp/khaos-worm-receiver.log \
            /tmp/khaos-worm-receiver.err.log \
            /var/log/khaos-authorityd-backend.log \
            /var/log/khaos-authorityd-backend.err.log; do
            if test -f "$log"; then
              echo "===== $log ====="
              tail -200 "$log"
            fi
          done
          sudo launchctl print system/com.khaos.authorityd.backend 2>&1 || true
      - name: Teardown launchd services
        if: always()
        run: |
          sudo launchctl bootout system/com.khaos.authorityd 2>/dev/null || true
          sudo launchctl bootout system/com.khaos.authorityd.backend 2>/dev/null || true
          sudo rm -f /Library/LaunchDaemons/com.khaos.authorityd.plist /Library/LaunchDaemons/com.khaos.authorityd.backend.plist
      - name: Cleanup CI keychain and secrets
        if: always()
        run: |
          if test -f /tmp/khaos-worm-receiver.pid; then
            worm_pid=$(cat /tmp/khaos-worm-receiver.pid)
            kill "$worm_pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              kill -0 "$worm_pid" 2>/dev/null || break
              sleep 0.1
            done
            kill -KILL "$worm_pid" 2>/dev/null || true
            rm -f /tmp/khaos-worm-receiver.pid
          fi
          security delete-keychain khaos-ci.keychain-db >/dev/null 2>&1 || true
          security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
          sudo security delete-trusted-cert -d /tmp/khaos-worm-ca.pem >/dev/null 2>&1 || true
      - name: Upload native proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-authority-macos-proof
          path: native-evidence/
          retention-days: 90

  windows-service-named-pipe:
    name: Windows Service-SID Named Pipe authority
    env:
      KHAOS_PRODUCER_JOB_NAME: Windows Service-SID Named Pipe authority
    runs-on: windows-2025
    environment: security-native
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install contract dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
      - name: Build native authority service and backend
        run: cargo build --locked --release --no-default-features --bin khaos-authorityd-windows --bin khaos-authorityd-backend-windows --manifest-path rust/khaos-core/Cargo.toml
      - name: Compute the effective policy digest
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\python"
          $digest = uv run python -c "from khaos.security.effective_policy import load_effective_policy; print(load_effective_policy('.').digest)"
          if (-not $digest) { throw 'policy digest unavailable' }
          "KHAOS_EFFECTIVE_POLICY_DIGEST=$digest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the Service-SID authority (DPAPI key provisioned under SYSTEM)
        shell: pwsh
        run: |
          $agentSid = ([System.Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          if ([string]::IsNullOrWhiteSpace($agentSid)) { throw 'agent SID unavailable' }
          "KHAOS_AGENT_SID=$agentSid" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          .\packaging\windows\install-khaos-authorityd.ps1 `
            -Binary "$env:GITHUB_WORKSPACE\rust\khaos-core\target\release\khaos-authorityd-windows.exe" `
            -AgentSid $agentSid `
            -ProtectedKeyPath 'C:\ProgramData\Khaos\authority-key.dpapi' `
            -ProvisionDpapiKey
          . (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\service-sid.ps1')
          $authoritySid = Get-KhaosServiceSid -ServiceName 'KhaosAuthorityD'
          "KHAOS_AUTHORITYD_SERVICE_SID=$authoritySid" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $catalogOwnerSid = ([System.Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          if ([string]::IsNullOrWhiteSpace($catalogOwnerSid)) { throw 'catalog owner SID unavailable' }
          $trustRoot = 'C:\ProgramData\Khaos'
          $auditTrustedDir = Join-Path $trustRoot '.khaos\audit'
          $trustedOwners = "$catalogOwnerSid,$authoritySid,S-1-5-18,S-1-5-32-544"
          $trustedAclSids = "$authoritySid,$catalogOwnerSid,$agentSid,S-1-5-18,S-1-5-32-544"
          $env:KHAOS_WINDOWS_TRUST_ROOT = $trustRoot
          $env:KHAOS_WINDOWS_TRUSTED_OWNER_SIDS = $trustedOwners
          $env:KHAOS_WINDOWS_TRUSTED_ACL_SIDS = $trustedAclSids
          $env:KHAOS_AUDIT_TRUSTED_DIR = $auditTrustedDir
          "KHAOS_WINDOWS_TRUST_ROOT=$trustRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KHAOS_WINDOWS_TRUSTED_OWNER_SIDS=$trustedOwners" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KHAOS_WINDOWS_TRUSTED_ACL_SIDS=$trustedAclSids" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KHAOS_AUDIT_TRUSTED_DIR=$auditTrustedDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run Windows native authority transaction with owned WORM receiver
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\python"
          $trustRoot = $env:KHAOS_WINDOWS_TRUST_ROOT
          $agentSid = $env:KHAOS_AGENT_SID
          $authoritySid = $env:KHAOS_AUTHORITYD_SERVICE_SID
          $catalogOwnerSid = ([System.Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          $auditTrustedDir = $env:KHAOS_AUDIT_TRUSTED_DIR
          if ([string]::IsNullOrWhiteSpace($trustRoot) -or
              [string]::IsNullOrWhiteSpace($agentSid) -or
              [string]::IsNullOrWhiteSpace($authoritySid) -or
              [string]::IsNullOrWhiteSpace($catalogOwnerSid) -or
              [string]::IsNullOrWhiteSpace($auditTrustedDir)) {
            throw 'Windows authority trust identity environment is incomplete'
          }
          function Set-KhaosAcl {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string[]]$Aces
            )
            & "$env:SystemRoot\System32\icacls.exe" $Path /inheritance:r /grant:r $Aces | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "failed to apply authority ACL to $Path" }
          }
          $caPath = 'C:\ProgramData\Khaos\worm-ca.pem'
          $wormLog = 'C:\ProgramData\Khaos\worm-receiver.log'
          $wormErrorLog = 'C:\ProgramData\Khaos\worm-receiver.err.log'
          $wormPidPath = 'C:\ProgramData\Khaos\worm-receiver.pid'
          Remove-Item -LiteralPath $caPath, $wormLog, $wormErrorLog -Force -ErrorAction SilentlyContinue
          try {
            & "$env:GITHUB_WORKSPACE\scripts\start_worm_audit_receiver.ps1" `
              -Workspace $env:GITHUB_WORKSPACE `
              -CaPath $caPath `
              -Directory 'C:\ProgramData\Khaos\worm-records' `
              -LogPath $wormLog `
              -ErrorLogPath $wormErrorLog `
              -PidPath $wormPidPath `
              -Port 8443
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $caPath)) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $caPath)) {
              Get-Content -LiteralPath $wormLog, $wormErrorLog -ErrorAction SilentlyContinue
              throw 'WORM receiver did not start'
            }
            Import-Certificate -FilePath $caPath -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            $healthDeadline = (Get-Date).AddSeconds(30)
            $healthy = $false
            while ((Get-Date) -lt $healthDeadline) {
              $receiverPid = [int](Get-Content -LiteralPath $wormPidPath -Raw)
              $receiver = Get-Process -Id $receiverPid -ErrorAction SilentlyContinue
              if ($null -eq $receiver -or $receiver.HasExited) {
                Get-Content -LiteralPath $wormLog, $wormErrorLog -ErrorAction SilentlyContinue
                throw "WORM receiver process ended (pid=$receiverPid)"
              }
              try {
                $response = Invoke-WebRequest -Uri 'https://127.0.0.1:8443/healthz' -UseBasicParsing -SkipCertificateCheck -TimeoutSec 5
                if ($response.StatusCode -eq 204) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) {
              Get-Content -LiteralPath $wormLog, $wormErrorLog -ErrorAction SilentlyContinue
              throw 'WORM receiver did not become healthy'
            }
            $env:KHAOS_AUDIT_WORM_ENDPOINT = 'https://127.0.0.1:8443/append'
            $env:KHAOS_AUDIT_WORM_CA_FILE = $caPath
            "KHAOS_AUDIT_WORM_ENDPOINT=$($env:KHAOS_AUDIT_WORM_ENDPOINT)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "KHAOS_AUDIT_WORM_CA_FILE=$caPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            $backendDir = 'C:\Program Files\Khaos'
            $backendSite = Join-Path $backendDir 'backend-site'
            New-Item -ItemType Directory -Force -Path $backendDir, $backendSite, C:\ProgramData\Khaos | Out-Null
            uv run python scripts/run_native_authority_e2e.py `
              --catalog-output 'C:\ProgramData\Khaos\native-resource-catalog.json'
            $rootAces = @('SYSTEM:(F)', 'Administrators:(F)', "*${catalogOwnerSid}:(F)")
            if ($agentSid -ne $catalogOwnerSid) { $rootAces += "*${agentSid}:(RX)" }
            if ($authoritySid -ne $catalogOwnerSid -and $authoritySid -ne $agentSid) { $rootAces += "*${authoritySid}:(RX)" }
            Set-KhaosAcl -Path $trustRoot -Aces $rootAces
            Set-KhaosAcl -Path 'C:\ProgramData\Khaos\native-resource-catalog.json' -Aces @('SYSTEM:(R)', 'Administrators:(F)', "*${catalogOwnerSid}:(R)", "*${agentSid}:(R)", "*${authoritySid}:(R)")
            $venvRoot = (Resolve-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.venv') -ErrorAction Stop).Path
            $venvPython = (Resolve-Path -LiteralPath (Join-Path $venvRoot 'Scripts\python.exe') -ErrorAction Stop).Path
            $venvSite = (Resolve-Path -LiteralPath (Join-Path $venvRoot 'Lib\site-packages') -ErrorAction Stop).Path
            if (-not (Test-Path -LiteralPath $venvSite -PathType Container)) {
                throw "Python site-packages directory is not a directory: $venvSite"
            }
            Copy-Item -Path "$venvSite\*" -Destination $backendSite -Recurse -Force
            Get-ChildItem -Path $backendSite -Filter '*.pth' -File -ErrorAction SilentlyContinue | Remove-Item -Force
            Remove-Item -LiteralPath (Join-Path $backendSite 'khaos') -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item -Path "$env:GITHUB_WORKSPACE\python\khaos" -Destination (Join-Path $backendSite 'khaos') -Recurse -Force
            $backendEntry = Join-Path $backendDir 'authorityd-backend-entry.py'
            Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\packaging\windows\authorityd-backend-entry.py" -Destination $backendEntry -Force
            $backendLog = 'C:\ProgramData\Khaos\authorityd-backend.log'
            $backendConfig = 'C:\ProgramData\Khaos\authorityd-backend.env'
            @(
                'KHAOS_AUTHORITY_PROFILE=native-production'
                "KHAOS_AUTHORITYD_BACKEND_PYTHON=$venvPython"
                "KHAOS_AUTHORITYD_BACKEND_ENTRY=$backendEntry"
                "KHAOS_AUTHORITYD_BACKEND_LOG=$backendLog"
                'KHAOS_AUTHORITYD_NAMED_PIPE=\\.\pipe\KhaosAuthorityD'
                'KHAOS_AUTHORITYD_BACKEND_PIPE=\\.\pipe\KhaosAuthorityDBackend'
                'KHAOS_AUTHORITYD_KEY_PATH=C:\ProgramData\Khaos\authorityd.pem'
                'KHAOS_AUTHORITYD_PUBLIC_KEY_PATH=C:\ProgramData\Khaos\authorityd.pub'
                'KHAOS_TYPED_RESOURCE_CATALOG_PATH=C:\ProgramData\Khaos\native-resource-catalog.json'
                "KHAOS_EFFECTIVE_POLICY_DIGEST=$env:KHAOS_EFFECTIVE_POLICY_DIGEST"
                "KHAOS_AUTHORITYD_SERVICE_SID=$env:KHAOS_AUTHORITYD_SERVICE_SID"
                "KHAOS_AGENT_SID=$env:KHAOS_AGENT_SID"
                "KHAOS_WINDOWS_TRUST_ROOT=$env:KHAOS_WINDOWS_TRUST_ROOT"
                "KHAOS_WINDOWS_TRUSTED_OWNER_SIDS=$env:KHAOS_WINDOWS_TRUSTED_OWNER_SIDS"
                "KHAOS_WINDOWS_TRUSTED_ACL_SIDS=$env:KHAOS_WINDOWS_TRUSTED_ACL_SIDS"
                "KHAOS_AUDIT_TRUSTED_DIR=$env:KHAOS_AUDIT_TRUSTED_DIR"
                'KHAOS_AUTHORITYD_PROTECTED_KEY_REF=khaos-authority-signing-key'
                "KHAOS_AUDIT_WORM_ENDPOINT=$env:KHAOS_AUDIT_WORM_ENDPOINT"
                "KHAOS_AUDIT_WORM_CA_FILE=$env:KHAOS_AUDIT_WORM_CA_FILE"
                'KHAOS_AUTHORITYD_CONNECTION_TIMEOUT=5'
            ) | Set-Content -LiteralPath $backendConfig -Encoding ascii
            Set-KhaosAcl -Path $backendConfig -Aces @('SYSTEM:(F)', 'Administrators:(F)')
            uv run python -c "from pathlib import Path; from khaos.security.authorityd_protocol import Ed25519KeyStore; k=Ed25519KeyStore.load_or_create(Path(r'C:\ProgramData\Khaos\authorityd.pem'), create=True); Path(r'C:\ProgramData\Khaos\authorityd.pub').write_bytes(k.public_key().public_bytes_raw())"
            Set-KhaosAcl -Path 'C:\ProgramData\Khaos\authorityd.pem' -Aces @('SYSTEM:(F)', 'Administrators:(F)', "*${catalogOwnerSid}:(R)", "*${agentSid}:(R)", "*${authoritySid}:(R)")
            Set-KhaosAcl -Path 'C:\ProgramData\Khaos\authorityd.pub' -Aces @('SYSTEM:(F)', 'Administrators:(F)', "*${catalogOwnerSid}:(R)", "*${agentSid}:(R)", "*${authoritySid}:(R)")
            $backendBinary = "$env:GITHUB_WORKSPACE\rust\khaos-core\target\release\khaos-authorityd-backend-windows.exe"
            & "$env:SystemRoot\System32\sc.exe" create KhaosAuthorityDBackend binPath= "`"$backendBinary`" --config `"$backendConfig`"" start= auto obj= LocalSystem | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'failed to create the backend service' }
            & "$env:SystemRoot\System32\sc.exe" start KhaosAuthorityDBackend | Out-Null
            Start-Sleep -Seconds 8
            $status = (Get-Service -Name KhaosAuthorityDBackend -ErrorAction SilentlyContinue).Status
            if ($status -ne 'Running') { throw "authority backend service is '$status'" }

            New-Item -ItemType Directory -Force native-evidence | Out-Null
            $env:KHAOS_AUTHORITY_PROFILE = 'native-production'
            $env:KHAOS_AUTHORITYD_NAMED_PIPE = '\\.\pipe\KhaosAuthorityD'
            $env:KHAOS_AUTHORITYD_PROTECTED_KEY_REF = 'khaos-authority-signing-key'
            $env:KHAOS_AUTHORITYD_PUBLIC_KEY_PATH = 'C:\ProgramData\Khaos\authorityd.pub'
            $env:KHAOS_TYPED_RESOURCE_CATALOG_PATH = 'C:\ProgramData\Khaos\native-resource-catalog.json'
            $env:KHAOS_WINDOWS_AUTHORITY_PIPE_CLIENT = "$env:GITHUB_WORKSPACE\rust\khaos-core\target\release\khaos-authorityd-windows.exe"
            uv run python scripts/run_native_authority_identity_probe.py | Tee-Object -Variable proof | Out-Null
            if (-not $proof) { throw 'native identity probe failed' }
            Set-Content -Path native-evidence\windows-named-pipe-proof.json.tmp -Value $proof
            $env:KHAOS_NATIVE_E2E_EFFECT_ROOT = 'C:\ProgramData\Khaos\e2e-effects'
            uv run python scripts/run_native_authority_e2e.py --output native-evidence\windows-named-pipe-e2e.json
            if (-not (Test-Path native-evidence\windows-named-pipe-e2e.json)) { throw 'native E2E artifact missing' }
          }
          finally {
            & "$env:GITHUB_WORKSPACE\scripts\stop_worm_audit_receiver.ps1" `
              -PidPath $wormPidPath
          }
      - name: Collect backend service diagnostics
        if: always()
        shell: pwsh
        run: |
          $service = Get-Service -Name KhaosAuthorityDBackend -ErrorAction SilentlyContinue
          if ($null -ne $service) { "backend service status: $($service.Status)" }
          $log = 'C:\ProgramData\Khaos\authorityd-backend.log'
          if (Test-Path -LiteralPath $log) {
              Get-Content -LiteralPath $log -Tail 200
          } else {
              'authority backend log was not created'
          }
          $wormLog = 'C:\ProgramData\Khaos\worm-receiver.log'
          $wormErrorLog = 'C:\ProgramData\Khaos\worm-receiver.err.log'
          if (Test-Path -LiteralPath $wormLog) {
              Get-Content -LiteralPath $wormLog -Tail 200
          } else {
              'WORM receiver log was not created'
          }
          if (Test-Path -LiteralPath $wormErrorLog) {
              Get-Content -LiteralPath $wormErrorLog -Tail 200
          }
      - name: Bind native evidence to this run
        shell: pwsh
        run: |
          $binding = @{
              github_sha = $env:GITHUB_SHA
              github_run_id = $env:GITHUB_RUN_ID
              runner_os = 'Windows'
              proof_type = 'windows-native-authority'
              policy_digest = $env:KHAOS_EFFECTIVE_POLICY_DIGEST
              platform = 'win32'
          }
          $proof = Get-Content native-evidence\windows-named-pipe-proof.json.tmp -Raw | ConvertFrom-Json
          $merged = @{}
          $proof.PSObject.Properties | ForEach-Object { $merged[$_.Name] = $_.Value }
          foreach ($key in $binding.Keys) { $merged[$key] = $binding[$key] }
          $merged | ConvertTo-Json -Depth 10 | Set-Content native-evidence\windows-named-pipe-proof.json
          Remove-Item native-evidence\windows-named-pipe-proof.json.tmp -Force
          if (-not (Test-Path native-evidence\windows-named-pipe-proof.json)) { throw 'bound proof missing' }
          $files = @{}
          Get-ChildItem -Path native-evidence -File | Where-Object { $_.Name -ne 'proof-manifest.json' } | ForEach-Object {
              $files[$_.Name] = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
          }
          $proofManifest = @{
              schema_version = 1
              proof_type = 'windows-native-authority'
              github_sha = $env:GITHUB_SHA
              github_run_id = $env:GITHUB_RUN_ID
              workflow_name = 'Native Authority Production E2E'
              job_name = $env:KHAOS_PRODUCER_JOB_NAME
              runner_os = 'Windows'
              runner_arch = $env:PROCESSOR_ARCHITECTURE
              platform = 'win32'
              policy_digest = $env:KHAOS_EFFECTIVE_POLICY_DIGEST
              files = $files
          }
          $proofManifest | ConvertTo-Json -Depth 10 -Compress | Set-Content native-evidence\proof-manifest.json -Encoding utf8
          if (-not (Test-Path native-evidence\proof-manifest.json)) { throw 'proof manifest missing' }
      - name: Cleanup service
        if: always()
        shell: pwsh
        run: |
          Stop-Service -Name KhaosAuthorityDBackend -ErrorAction SilentlyContinue
          sc.exe delete KhaosAuthorityDBackend | Out-Null
          Stop-Service -Name KhaosAuthorityD -ErrorAction SilentlyContinue
          sc.exe delete KhaosAuthorityD | Out-Null
      - name: Upload native proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-authority-windows-proof
          path: native-evidence/
          retention-days: 90

  profile-results:
    name: Publish deployment profile results
    if: always()
    needs:
      - native-profile
      - community-local-profile
      - macos-launchd-xpc
      - windows-service-named-pipe
    runs-on: ubuntu-24.04
    outputs:
      community_profile: ${{ steps.results.outputs.community_profile }}
      macos_signed_distribution: ${{ steps.results.outputs.macos_signed_distribution }}
      signed_profile_enabled: ${{ steps.results.outputs.signed_profile_enabled }}
    steps:
      - id: results
        name: Resolve profile-scoped statuses
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          COMMUNITY_RESULT: ${{ needs.community-local-profile.result }}
          PROFILE_RESOLUTION_RESULT: ${{ needs.native-profile.result }}
          MACOS_ENABLED: ${{ needs.native-profile.outputs.macos_enabled }}
          MACOS_RESULT: ${{ needs.macos-launchd-xpc.result }}
          WINDOWS_RESULT: ${{ needs.windows-service-named-pipe.result }}
        run: |
          set -eu
          if [ "$COMMUNITY_RESULT" = "success" ]; then
            community_profile=pass
          else
            community_profile=fail
          fi

          if [ "$PROFILE_RESOLUTION_RESULT" != "success" ]; then
            signed_profile_enabled=false
            macos_signed_distribution=blocked_external
          elif [ "$MACOS_ENABLED" != "true" ]; then
            signed_profile_enabled=false
            macos_signed_distribution=optional_profile_not_enabled
          else
            signed_profile_enabled=true
            if [ "$MACOS_RESULT" = "success" ]; then
              macos_signed_distribution=pass
            else
              macos_signed_distribution=fail
            fi
          fi

          mkdir -p profile-evidence
          PROFILE_JSON="$PWD/profile-evidence/deployment-profile-results.json" \
            COMMUNITY_PROFILE="$community_profile" \
            SIGNED_PROFILE="$macos_signed_distribution" \
            SIGNED_ENABLED="$signed_profile_enabled" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = {
              "schema_version": 1,
              "evidence_scope": "native-authority-production-e2e",
              "github_sha": os.environ["GITHUB_SHA_VALUE"],
              "github_run_id": os.environ["GITHUB_RUN_ID_VALUE"],
              "profiles": {
                  "community_local": {
                      "status": os.environ["COMMUNITY_PROFILE"],
                      "required_for_this_workflow": True,
                  },
                  "macos_signed_distribution": {
                      "status": os.environ["SIGNED_PROFILE"],
                      "enabled": os.environ["SIGNED_ENABLED"] == "true",
                      "requires": [
                          "KHAOS_NATIVE_MACOS_E2E=true",
                          "KHAOS_MACOS_TEAM_ID",
                          "KHAOS_MACOS_CODESIGN_CERTIFICATE",
                      ],
                  },
              },
          }
          Path(os.environ["PROFILE_JSON"]).write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "community_profile=$community_profile" >> "$GITHUB_OUTPUT"
          echo "macos_signed_distribution=$macos_signed_distribution" >> "$GITHUB_OUTPUT"
          echo "signed_profile_enabled=$signed_profile_enabled" >> "$GITHUB_OUTPUT"

          test "$community_profile" = pass
          test "$macos_signed_distribution" = pass \
            || test "$macos_signed_distribution" = optional_profile_not_enabled
      - name: Upload deployment profile results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-profile-results
          path: profile-evidence/deployment-profile-results.json
          retention-days: 90
