name: GitHub Ruleset Audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1"
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export-ruleset:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Export and verify repository rulesets
        env:
          GH_TOKEN: ${{ secrets.RULESET_AUDIT_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/audit-github-ruleset.sh
      - name: Upload release-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-ruleset-audit
          path: ruleset-audit/
          retention-days: 90
