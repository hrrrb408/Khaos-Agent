name: GitHub Ruleset Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1"

permissions:
  contents: read

jobs:
  export-ruleset:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Export and verify repository rulesets
        env:
          GH_TOKEN: ${{ secrets.RULESET_AUDIT_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/audit-github-ruleset.sh
      - name: Upload release-audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: github-ruleset-audit
          path: ruleset-audit/
