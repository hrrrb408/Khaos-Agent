name: Supply Chain Audit

# Round-5 Batch 5.5: supply-chain security jobs.
#
# Scans all three language layers for known vulnerabilities:
#   1. pip-audit     — Python dependencies (requirements-lock.txt)
#   2. cargo audit   — Rust dependencies (Cargo.lock)
#   3. govulncheck   — Go dependencies (go.mod)
#
# All three must pass before a PR touching dependency files can be
# merged to main.  Branch protection should add these as required
# status checks.

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run weekly on Monday 09:00 UTC to catch newly-disclosed CVEs.
    - cron: "0 9 * * 1"

jobs:
  # A commit-bound dependency inventory is retained with the audit results.
  # It is intentionally generated from the repository lockfiles and exact
  # checkout SHA, rather than downloaded from an unpinned third-party action.
  provenance:
    name: dependency provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.mod
      - name: Build lockfile and module provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p provenance
          printf '%s\n' "$GITHUB_SHA" > provenance/commit.txt
          sha256sum uv.lock go/go.mod rust/khaos-core/Cargo.toml rust/khaos-core/Cargo.lock Dockerfile > provenance/lockfile-sha256.txt
          if [ -f go/go.sum ]; then sha256sum go/go.sum >> provenance/lockfile-sha256.txt; fi
          (cd go && go mod verify && go list -mod=readonly -m all) > provenance/go-modules.txt
          cargo metadata --locked --no-deps --format-version 1 --manifest-path rust/khaos-core/Cargo.toml > provenance/cargo-metadata.json
      - name: Upload dependency provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supply-chain-provenance-${{ github.sha }}
          path: provenance/
          if-no-files-found: error

  # ─── 1. Python: pip-audit ──────────────────────────────────────────
  pip-audit:
    name: pip-audit (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install uv + pip-audit (hash-locked)
        # Batch 10.7 (round-10 §十一): pip-audit is now hash-locked via
        # audit-requirements.txt (generated with `uv pip compile
        # --generate-hashes`).  A compromised PyPI mirror that swaps the
        # same-version pip-audit wheel (or any of its 28 transitive deps)
        # is now refused by pip --require-hashes.  This closes the
        # 'Security Evidence Trust Root' gap: pip-audit decides whether
        # the required 'pip-audit (Python)' check is green or red, so a
        # swapped tool could hide real CVEs.
        #
        # To refresh the lock: uv pip compile --generate-hashes
        # --python-version 3.11 -o python/audit-requirements.txt
        # pip-audit==<version>
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          python -m pip install --require-hashes -r python/audit-requirements.txt
      - name: Audit Python dependencies
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project \
            --no-header --format requirements-txt \
            --output-file requirements-audit.txt
          diff -u python/requirements-lock.txt requirements-audit.txt
          pip-audit \
            --requirement requirements-audit.txt \
            --require-hashes \
            --strict \
            --desc

  # ─── 2. Rust: cargo audit ──────────────────────────────────────────
  cargo-audit:
    name: cargo audit (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        working-directory: rust/khaos-core
        # --ignore flags suppress advisories that are not exploitable
        # in this codebase but cannot be immediately fixed (pyo3 0.22
        # needs a major upgrade to >= 0.29).  See rust/khaos-core/audit.toml
        # for justification.  --deny warnings fails on everything else
        # (unmaintained crates, new CVEs, etc.).
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0177 \
            --ignore RUSTSEC-2025-0020

  # ─── 3. Go: govulncheck ────────────────────────────────────────────
  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      # The audit toolchain is independent of the build toolchain.  Both
      # its Go runtime and module version are pinned for reproducibility.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Audit Go dependencies
        working-directory: go
        run: govulncheck ./...
