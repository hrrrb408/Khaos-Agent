name: Supply Chain Audit

# Round-5 Batch 5.5: supply-chain security jobs.
#
# Scans all three language layers for known vulnerabilities:
#   1. pip-audit     — Python dependencies (requirements-lock.txt)
#   2. cargo audit   — Rust dependencies (Cargo.lock)
#   3. govulncheck   — Go dependencies (go.mod)
#
# All three must pass before a PR touching dependency files can be
# merged to main.  Branch protection should add these as required
# status checks.

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run weekly on Monday 09:00 UTC to catch newly-disclosed CVEs.
    - cron: "0 9 * * 1"

jobs:
  # ─── 1. Python: pip-audit ──────────────────────────────────────────
  pip-audit:
    name: pip-audit (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install uv + pip-audit
        # Batch 9.7b (round-9 §二十一): uv is installed via the hash-pinned
        # bootstrap-requirements.txt (it is a single Rust binary with no
        # Python deps, so hash verification is complete).  pip-audit is
        # installed separately WITHOUT --require-hashes here because it has
        # a heavy transitive dependency tree (CacheControl, cyclonedx, …)
        # that would need its own hash pinning.  pip-audit is the AUDIT
        # TOOL, not the trust root — the trust root for business deps is
        # pip-audit's own --require-hashes check on requirements-lock.txt
        # below.  pip-audit itself is version-pinned so a swapped same-
        # version wheel is the only residual risk (acceptable for the
        # audit tool, which does not influence what gets installed into
        # production).
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          python -m pip install pip-audit==2.10.0
      - name: Audit Python dependencies
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project \
            --no-header --format requirements-txt \
            --output-file requirements-audit.txt
          diff -u python/requirements-lock.txt requirements-audit.txt
          pip-audit \
            --requirement requirements-audit.txt \
            --require-hashes \
            --strict \
            --desc

  # ─── 2. Rust: cargo audit ──────────────────────────────────────────
  cargo-audit:
    name: cargo audit (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        working-directory: rust/khaos-core
        # --ignore flags suppress advisories that are not exploitable
        # in this codebase but cannot be immediately fixed (pyo3 0.22
        # needs a major upgrade to >= 0.29).  See rust/khaos-core/audit.toml
        # for justification.  --deny warnings fails on everything else
        # (unmaintained crates, new CVEs, etc.).
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0177 \
            --ignore RUSTSEC-2025-0020

  # ─── 3. Go: govulncheck ────────────────────────────────────────────
  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      # The audit toolchain is independent of the build toolchain.  Both
      # its Go runtime and module version are pinned for reproducibility.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Audit Go dependencies
        working-directory: go
        run: govulncheck ./...
