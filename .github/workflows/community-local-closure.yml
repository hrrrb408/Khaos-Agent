name: Community Local Security Closure

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: community-local-closure-${{ github.sha }}
  cancel-in-progress: false

jobs:
  community-local:
    name: Community Local evidence aggregator
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      KHAOS_DEV_MODE: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install evidence verifier dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Fetch exact-SHA producer artifacts from Security Closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p producer-input
          PYTHONPATH=python python scripts/fetch_security_producer_artifacts.py \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --output-dir producer-input \
            --manifest producer-input/producer-artifact-manifest.json
      - name: Aggregate producer-owned Community Local evidence
        run: |
          PYTHONPATH=python python scripts/collect_local_security_evidence.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --producer-dir producer-input \
            --producer-manifest producer-input/producer-artifact-manifest.json \
            --commit "$GITHUB_SHA" \
            --output local-security-evidence.json
      - name: Upload exact-SHA local closure evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-security-evidence-${{ github.sha }}
          path: local-security-evidence.json
          if-no-files-found: error
          retention-days: 90
