name: Security Contract Matrix

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Set up Python pinned action
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Go pinned action
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: go/go.mod
      - name: Install contract dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test --extra tui
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build native execution launcher
        if: runner.os != 'Windows'
        run: |
          cargo build --locked --release --no-default-features \
            --bin khaos-exec-launcher \
            --manifest-path rust/khaos-core/Cargo.toml
          echo "KHAOS_EXEC_LAUNCHER=$GITHUB_WORKSPACE/rust/khaos-core/target/release/khaos-exec-launcher" >> "$GITHUB_ENV"
      - name: Build native Windows sandbox helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release --no-default-features --bin khaos-windows-sandbox --manifest-path rust/khaos-core/Cargo.toml
      - name: Require native Windows sandbox evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "KHAOS_WINDOWS_SANDBOX_HELPER=$env:GITHUB_WORKSPACE\rust\khaos-core\target\release\khaos-windows-sandbox.exe" >> $env:GITHUB_ENV
          "KHAOS_REQUIRE_WINDOWS_NATIVE=1" >> $env:GITHUB_ENV
      - name: Run cross-platform security contracts
        run: uv run python -m pytest python/tests/security/test_security_facts.py python/tests/security/test_ci_security_policy.py python/tests/security/test_middleware.py python/tests/security/test_sandbox.py python/tests/security/test_policy.py python/tests/security/test_effective_policy.py python/tests/security/test_authority_broker.py python/tests/security/test_network_broker.py python/tests/security/test_production_reachability.py python/tests/agent/test_approval_broker.py python/tests/agent/test_operation_approval_ledger.py python/tests/agent/test_turn_coordinator.py python/tests/permissions/test_permission_engine.py python/tests/permissions/test_commands_require_approval.py python/tests/tools/test_capability_broker.py python/tests/tools/test_network_authority_integration.py python/tests/tools/test_tool_scheduler.py python/tests/tools/test_browser_tools.py python/tests/tools/test_browser_close_concurrency.py python/tests/audit/test_audit_logger.py python/tests/coding/test_backend_selector.py python/tests/coding/test_permission_profile.py python/tests/coding/test_windows_fail_closed.py python/tests/tui/test_view_model.py python/tests/tui/test_tui_app.py python/tests/runtime/test_aclose.py -q
      - name: Check production reachability artifact
        run: uv run python scripts/generate_production_reachability.py --check
      - name: Run durable webhook and workspace contracts
        run: uv run python -m pytest python/tests/channels/test_webhook.py python/tests/channels/test_channel_registry.py python/tests/coding/test_workspace_storage.py python/tests/coding/test_workspace_storage_authority.py python/tests/coding/test_office_mutation_authority.py -q
      - name: Run POSIX host process contracts
        if: runner.os != 'Windows'
        run: uv run python -m pytest python/tests/coding/test_process_supervisor.py python/tests/coding/test_managed_process_lifecycle.py -q
      - name: Run POSIX verification authority contracts
        if: runner.os != 'Windows'
        run: uv run python -m pytest python/tests/coding/test_m4_batch3_1_6_2_authority.py -q
      - name: Run POSIX RPC peer-identity contracts
        if: runner.os != 'Windows'
        run: uv run python -m pytest python/tests/test_grpc_server.py python/tests/runtime/test_factory_effective_policy.py python/tests/security/test_m4_security_regression.py python/tests/subagents/test_spawner_shutdown.py python/tests/subagents/test_runner_shutdown.py python/tests/subagents/test_service.py python/tests/scheduler/test_cron_engine.py -q
      - name: Run POSIX workspace boundary contracts
        if: runner.os != 'Windows'
        run: uv run python -m pytest python/tests/coding/test_safe_workspace_fs.py python/tests/coding/test_workspace_boundary.py python/tests/coding/test_workspace_manager.py python/tests/coding/test_execution_binding.py python/tests/coding/test_m4_batch3_0_workspace_mutation.py python/tests/tools/test_office_workspace_fs_security.py python/tests/tools/test_office_mutation_fence.py python/tests/tools/test_office_aggregate_storage.py python/tests/tools/test_file_search_redos.py -q
      - name: Run Go gateway tests
        working-directory: go
        run: go test ./...
      - name: Run Rust core tests
        working-directory: rust/khaos-core
        # P1-3: --all-targets so integration tests and benches are built/run,
        # not just lib unit tests.
        run: cargo test --locked --all-targets
