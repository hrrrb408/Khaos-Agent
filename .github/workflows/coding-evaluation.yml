name: Coding Capability Evaluation

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# M8.0 is a deterministic Fake Model/fixture contract in merge CI.  Real
# providers are intentionally outside this workflow: they belong to manual or
# scheduled runs and their credentials/network policy must never enter PR CI.
jobs:
  coding-eval-unit:
    name: Coding Eval Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate contracts and CLI parser
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run pytest -q
          python/tests/evaluation/test_coding_eval_contracts.py
          python/tests/evaluation/test_coding_eval_cli.py
          python/tests/evaluation/test_coding_eval_metrics.py
          python/tests/evaluation/test_coding_eval_persistence.py

  coding-eval-fixture-integrity:
    name: Coding Eval Fixture Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate immutable pack and hidden namespace
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run pytest -q
          python/tests/evaluation/test_coding_eval_fixtures.py
          python/tests/evaluation/test_coding_eval_contracts.py

  coding-eval-oracle:
    name: Coding Eval Oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate external oracles and diff evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run pytest -q python/tests/evaluation/test_coding_eval_oracle.py

  coding-eval-fake-agent-e2e:
    name: Coding Eval Fake Agent E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate real AgentLoop adapter, ledger, and read-only review
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run pytest -q
          python/tests/evaluation/test_coding_eval_runner.py
          python/tests/evaluation/test_coding_eval_runtime.py
          python/tests/evaluation/test_coding_eval_persistence.py
