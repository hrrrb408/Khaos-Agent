name: Security Closure Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Round-13 review High-2: a main push (merge) must NOT cancel a prior main
  # push's evidence run — every exact main SHA needs its own evidence.  PR
  # pushes CAN cancel prior attempts of the same PR (github.ref is the PR ref).
  group: >-
    security-closure-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Python Security Suite, Go Race, Rust Clippy, Browser Kernel Attack E2E.
  core-security:
    uses: ./.github/workflows/batch5-required-jobs.yml

  # Rust Test plus the Python/Go/Rust strict cross-platform contracts.
  strict-contracts:
    uses: ./.github/workflows/security-contract-matrix.yml

  # Linux Bwrap Real Kernel, macOS Seatbelt Real Kernel, Browser Non-root
  # Fullstack, Browser Kernel Attack E2E, and Windows fail-closed evidence.
  real-kernel:
    uses: ./.github/workflows/platform-sandbox-security.yml

  playwright-security:
    uses: ./.github/workflows/browser-e2e.yml

  # Docker Security E2E.
  docker-security:
    uses: ./.github/workflows/docker-security.yml

  # Supply Chain Audit.
  supply-chain:
    uses: ./.github/workflows/supply-chain-audit.yml

  # Round-13 review CI-1: Pyright static type check as a Security Closure
  # dependency (so it's a REAL required gate, not just a named workflow that
  # the ruleset doesn't enforce).
  type-check:
    uses: ./.github/workflows/type-check.yml

  # Round-14 review CI: Ruleset Audit as a Security Closure dependency so
  # a ruleset drift that the audit catches actually blocks the merge.
  ruleset-audit:
    uses: ./.github/workflows/ruleset-audit.yml

  # Round-12 review CI-1: Product Integrity is a SEPARATE required gate (not a
  # dependency of Security Closure).  Running it inside Security Closure caused
  # every PR to execute the full Python/Go/Rust suite TWICE (once standalone,
  # once via the reusable-workflow call) — doubling runner consumption and
  # merge time for zero additional safety.  Both gates are independently
  # required by the GitHub ruleset.
  #
  # Schema Fuzz, Authorization Drift E2E, Process Lifecycle E2E, and
  # Event-loop Starvation Tests are explicit independent gate dependencies.
  closure-adversarial:
    name: Closure Adversarial Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build native execution launcher
        run: |
          cargo build --locked --release --no-default-features \
            --bin khaos-exec-launcher \
            --manifest-path rust/khaos-core/Cargo.toml
          echo "KHAOS_EXEC_LAUNCHER=$GITHUB_WORKSPACE/rust/khaos-core/target/release/khaos-exec-launcher" >> "$GITHUB_ENV"
      - name: Schema Fuzz
        run: |
          python scripts/generate_security_inventory.py --check
          python scripts/check_privileged_spawn_sites.py --check
          python scripts/generate_browser_kernel_protocol.py --check
          python -m pytest \
            python/tests/security/test_schema_fuzz.py \
            python/tests/security/test_privileged_spawn_verifier.py \
            -q -v
          python scripts/build_security_closure_evidence.py test-fragment \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job closure-adversarial --test schema_injection \
            --runner-os "$RUNNER_OS" --output evidence/schema_injection.json
      - name: Authorization Drift E2E
        run: |
          python -m pytest \
            python/tests/permissions/test_authorization_resource.py \
            python/tests/coding/test_runtime_approval_e2e.py \
            python/tests/agent/test_operation_approval_ledger.py \
            -q -v
          for test_name in workspace_escape approval_replay; do
            python scripts/build_security_closure_evidence.py test-fragment \
              --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
              --job closure-adversarial --test "$test_name" \
              --runner-os "$RUNNER_OS" --output "evidence/$test_name.json"
          done
      - name: Process Lifecycle E2E
        run: |
          python -m pytest \
            python/tests/coding/test_process_supervisor.py \
            python/tests/coding/test_managed_process_lifecycle.py \
            python/tests/coding/test_managed_process_soak.py \
            python/tests/coding/test_execution_service.py \
            python/tests/runtime/test_aclose.py \
            -q -v
          python scripts/build_security_closure_evidence.py test-fragment \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job closure-adversarial --test process_tree_escape \
            --runner-os "$RUNNER_OS" --output evidence/process_tree_escape.json
      - name: Resource Ownership Closure E2E
        # Round-17 review §十五: unified lifecycle proof matrix.
        # Every first-class ResourceOwner (ExecutionService, DockerBackend,
        # ManagedProcessHandle, ProcessSupervisor, LspClient,
        # BrowserEgressProxy, BrowserManager, RuntimeResult) must pass the
        # shared lifecycle assertions plus owner-specific fault matrices and
        # independent external-oracle checks:
        # start-after-close rejected, concurrent close joins same task,
        # first-close-failure retries, cleanup exception/CancelledError →
        # QUARANTINED, and CLOSED ⇒ no owned resources.  Also runs the
        # CleanupLedger v2 suite (run_step postcondition / generation
        # invalidation).
        run: |
          python -m pytest \
            python/tests/coding/test_resource_owner_closure.py \
            python/tests/coding/test_cleanup_ledger.py \
            -q -v
          python -m pytest \
            python/tests/tools/test_sandbox_tools.py \
            -q -v -k docker_backend_shutdown_spawn_barrier
          python scripts/build_security_closure_evidence.py test-fragment \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job closure-adversarial --test resource_ownership_closure \
            --runner-os "$RUNNER_OS" --output evidence/resource_ownership_closure.json
      - name: Event-loop Starvation Tests
        run: |
          python -m pytest \
            python/tests/security/test_event_loop_starvation.py \
            python/tests/coding/test_office_mutation_authority.py \
            -q -v
      - name: Upload closure adversarial evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: closure-adversarial-evidence
          path: evidence/*.json
          if-no-files-found: error

  m6-adversarial-matrix:
    name: M6 Adversarial Closure Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate M6 governance, reachability, and report contract
        run: |
          python scripts/validate_m6_governance.py
          python scripts/generate_production_reachability.py --check
          python scripts/build_m6_closure_report.py --check-template
          python scripts/generate_security_inventory.py --check
      - name: Run independent M6 postcondition matrix
        run: |
          python -m pytest python/tests/security/test_m6_adversarial_matrix.py \
            python/tests/security/test_m6_closure_report.py \
            python/tests/security/test_m6_governance.py \
            python/tests/security/test_upstream_codex_security_watch.py -q -v
      - name: Build evidence-bound M6 report
        run: |
          mkdir -p m6-evidence
          python scripts/build_m6_closure_report.py \
            --commit "$GITHUB_SHA" \
            --ci-run "$GITHUB_RUN_ID" \
            --test-counts "M6 matrix completed; native and product evidence remain separate" \
            --output m6-evidence/m6-security-closure-report.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m6-security-closure-report
          path: m6-evidence/m6-security-closure-report.md
          if-no-files-found: error

  security-closure-gate:
    name: Security Closure Gate
    if: always()
    needs:
      - core-security
      - strict-contracts
      - real-kernel
      - playwright-security
      - docker-security
      - supply-chain
      - type-check
      - ruleset-audit
      - closure-adversarial
      - m6-adversarial-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject any non-success dependency
        env:
          CORE_SECURITY: ${{ needs.core-security.result }}
          STRICT_CONTRACTS: ${{ needs.strict-contracts.result }}
          REAL_KERNEL: ${{ needs.real-kernel.result }}
          PLAYWRIGHT_SECURITY: ${{ needs.playwright-security.result }}
          DOCKER_SECURITY: ${{ needs.docker-security.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          TYPE_CHECK: ${{ needs.type-check.result }}
          RULESET_AUDIT: ${{ needs.ruleset-audit.result }}
          CLOSURE_ADVERSARIAL: ${{ needs.closure-adversarial.result }}
          M6_ADVERSARIAL_MATRIX: ${{ needs.m6-adversarial-matrix.result }}
        run: |
          for result in \
            "$CORE_SECURITY" "$STRICT_CONTRACTS" "$REAL_KERNEL" \
            "$PLAYWRIGHT_SECURITY" "$DOCKER_SECURITY" "$SUPPLY_CHAIN" \
            "$TYPE_CHECK" "$RULESET_AUDIT" "$CLOSURE_ADVERSARIAL"; do
            test "$result" = "success"
          done
          test "$M6_ADVERSARIAL_MATRIX" = "success"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Attest the exact gate commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p security-evidence
          printf '%s\n' "$GITHUB_SHA" > security-evidence/commit-attestation.txt
      - name: Download mandatory browser evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-non-root-evidence
          path: security-evidence-input
      - name: Download mandatory adversarial evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: security-test-evidence-*
          path: security-test-evidence-input
          merge-multiple: true
      - name: Download closure adversarial evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: closure-adversarial-evidence
          path: security-test-evidence-input
      - name: Validate and assemble Security Evidence Artifact
        run: |
          python scripts/build_security_closure_evidence.py final \
            --fragment security-evidence-input/browser-production-fragment.json \
            --fragments-dir security-test-evidence-input \
            --commit "$GITHUB_SHA" \
            --output security-evidence/security-evidence.json
      - name: Upload Security Evidence Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-evidence-${{ github.sha }}
          path: security-evidence/
          if-no-files-found: error
