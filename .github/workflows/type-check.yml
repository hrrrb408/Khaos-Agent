name: Type Check

# P2-6 (review): Pyright static type checking for the security-critical
# Python modules.  Previously there was NO type-check gate at all — the
# Makefile lint target literally printed "P0-A lint tooling not configured
# yet", and pyright existed only under the optional `lsp` extra (used by the
# runtime coding-intelligence integration, not as a CI gate).
#
# This workflow is currently a REPORTING gate (continue-on-error at the
# workflow level), NOT a required merge authority.  The security-critical
# modules (runtime/, security/, permissions/) are configured ``strict`` in
# pyproject.toml, and a large existing codebase produces errors on first
# enablement.  The rollout plan (docs/type-check-rollout.md) tracks fixing
# those errors module-by-module; once a module reaches zero errors the gate
# is promoted to required for that module, and once all three are clean the
# whole workflow becomes a required merge authority.

permissions:
  contents: read

concurrency:
  group: type-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "codex/**"]
  workflow_dispatch:

jobs:
  pyright:
    name: Pyright Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # P2-6: reporting gate — does not fail the PR while the strict modules
    # still have pre-existing errors.  Promote to a hard failure per the
    # rollout plan once each module is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pyright
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test --extra lsp
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run Pyright (security-critical strict + basic baseline)
        run: uv run pyright
