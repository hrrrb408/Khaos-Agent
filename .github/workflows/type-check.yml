name: Type Check

# Round-12 review CI-3 / P1-4: a hard Pyright gate for the security-critical
# modules.  This would have caught the ``managed.py`` missing-``logger``
# NameError (a deterministic bug in an exception path that all runtime tests
# missed because the happy path never triggered it).  Static type checking
# catches undefined names, wrong argument types, and missing imports WITHOUT
# needing to trigger the exception path.
#
# Scope: only the files known to be pyright-clean (zero errors) are checked.
# This is a HARD required gate — it never soft-fails.  As more modules are
# cleaned up they are added here.  The full-repository rollout is tracked in
# docs/type-check-rollout.md.

permissions:
  contents: read

concurrency:
  group: type-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
  workflow_dispatch:

jobs:
  pyright:
    name: Pyright (security-critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pyright
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test --extra lsp
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run Pyright on security-critical modules (HARD gate)
        # These files are known pyright-clean (zero errors).  Adding a file
        # here is a commitment to keep it clean; removing one requires a
        # documented reason.  As more modules reach zero errors, add them.
        #
        # Batch 15.7: extended scope to cover the execution-service entry
        # point, the process supervisor (admission fence / shutdown state
        # machine), the cleanup ledger, the LSP client, the browser egress
        # proxy, the tool registry, and the approval broker.  These are all
        # security-critical surfaces that previously had no static-type gate.
        # Round-17: added resource_owner.py (unified ResourceOwner protocol).
        # Round-20: add the evidence-bound platform/Docker decision and
        # executable-identity modules to the same hard type gate.  Keep the
        # scheduler here as well: it freezes the evidence-bound authority
        # before process dispatch and must not regress to dynamic-call errors.
        run: |
          uv run pyright \
            python/khaos/runtime/authority.py \
            python/khaos/runtime/lifecycle.py \
            python/khaos/coding/execution/capability.py \
            python/khaos/coding/execution/authority.py \
            python/khaos/coding/execution/docker.py \
            python/khaos/coding/execution/identity.py \
            python/khaos/coding/execution/managed.py \
            python/khaos/coding/execution/platform.py \
            python/khaos/coding/execution/service.py \
            python/khaos/coding/execution/supervisor.py \
            python/khaos/coding/execution/cleanup_ledger.py \
            python/khaos/coding/execution/resource_owner.py \
            python/khaos/coding/intelligence/lsp/client.py \
            python/khaos/security/browser_egress_proxy.py \
            python/khaos/tools/registry.py \
            python/khaos/tools/scheduler.py \
            python/khaos/agent/approval.py
