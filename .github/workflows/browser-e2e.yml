name: Browser Security E2E

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
  workflow_dispatch:

jobs:
  playwright-security:
    # M2: real Playwright + Chromium E2E for the browser security layer.
    # Mirrors the structure of docker-security.yml: dedicated workflow,
    # env-var gate (``KHAOS_RUN_BROWSER_E2E=1``), pytest marker filter
    # (``-m browser_real``), and a single OS to keep CI minutes in
    # check.  The mock-only tests in test_browser_tools.py still run in
    # security-contract-matrix.yml on the full OS matrix, so this job
    # only adds the *real* browser layer.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install test + browser dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test --extra browser
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Download Chromium binary
        # M2: the ``browser`` extra installs the Python package, but
        # the actual browser binary must be downloaded separately.
        run: python -m playwright install --with-deps chromium
      - name: Run real Playwright security E2E
        env:
          KHAOS_RUN_BROWSER_E2E: "1"
        run: python -m pytest python/tests/tools/test_browser_tools_e2e.py -q -m browser_real -v
      - name: Emit DNS rebinding evidence
        run: |
          python scripts/build_security_closure_evidence.py test-fragment \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --job playwright-security --test browser_dns_rebinding \
            --runner-os "$RUNNER_OS" --output evidence/browser_dns_rebinding.json
      - name: Upload DNS rebinding evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-test-evidence-browser-dns-rebinding
          path: evidence/browser_dns_rebinding.json
          if-no-files-found: error
          retention-days: 90
