name: Platform Sandbox Security E2E

permissions:
  contents: read

concurrency:
  group: platform-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
  workflow_dispatch:

jobs:
  linux-bwrap-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: Enable unprivileged user namespaces (if restricted by AppArmor)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Use unprivileged bwrap with bounded tmpfs support
        run: |
          sudo chmod 0755 /usr/bin/bwrap
          test ! -u /usr/bin/bwrap
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build native execution and inner seccomp launchers
        run: cargo build --locked --release --no-default-features --bin khaos-exec-launcher --bin khaos-sandbox-launcher --manifest-path rust/khaos-core/Cargo.toml
      - name: Delegate cgroup v2 subtree
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers
          for controller in cpu memory pids io; do
            if grep -qw "$controller" /sys/fs/cgroup/cgroup.controllers; then
              echo "+$controller" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
            fi
          done
          sudo mkdir -p /sys/fs/cgroup/khaos
          # A cgroup v2 controller must be enabled at every non-leaf level.
          # Chown the pseudo-files as well as the directory so the unprivileged
          # test process can create and configure per-execution children.
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/khaos
          for controller in cpu memory pids io; do
            if grep -qw "$controller" /sys/fs/cgroup/khaos/cgroup.controllers; then
              echo "+$controller" > /sys/fs/cgroup/khaos/cgroup.subtree_control
            fi
          done
          sudo mkdir -p /sys/fs/cgroup/khaos/runner /sys/fs/cgroup/khaos/workloads
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/khaos
          for controller in cpu memory pids io; do
            if grep -qw "$controller" /sys/fs/cgroup/khaos/workloads/cgroup.controllers; then
              echo "+$controller" > /sys/fs/cgroup/khaos/workloads/cgroup.subtree_control
            fi
          done
          test -w /sys/fs/cgroup/khaos
          test -w /sys/fs/cgroup/khaos/cgroup.procs
          test -w /sys/fs/cgroup/khaos/cgroup.subtree_control
          test -w /sys/fs/cgroup/khaos/runner/cgroup.procs
          test -w /sys/fs/cgroup/khaos/workloads/cgroup.procs
      - name: Prepare block-backed sandbox workspace
        run: |
          # GitHub-hosted runners may place /tmp on an overlay/pseudo device.
          # cgroup v2 io.max correctly rejects such a device with ENODEV.
          # Use a real loop-backed ext4 mount so the security job proves the
          # I/O controller instead of weakening production to skip io.max.
          sudo truncate -s 2G /var/tmp/khaos-sandbox-workspace.img
          sudo mkfs.ext4 -F -q /var/tmp/khaos-sandbox-workspace.img
          sudo mkdir -p /mnt/khaos-sandbox-workspace
          sudo mount -o loop,noatime /var/tmp/khaos-sandbox-workspace.img /mnt/khaos-sandbox-workspace
          sudo chown "$(id -u):$(id -g)" /mnt/khaos-sandbox-workspace
          test -w /mnt/khaos-sandbox-workspace
          echo "TMPDIR=/mnt/khaos-sandbox-workspace" >> "$GITHUB_ENV"
      - name: Capture pre-test diagnostics
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "=== uname ==="
            uname -a
            echo "=== bwrap version ==="
            bwrap --version
            echo "=== bwrap permissions ==="
            ls -l /usr/bin/bwrap
            echo "=== sysctl userns ==="
            sysctl kernel.unprivileged_userns_clone 2>&1
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1
            echo "=== TMPDIR ==="
            echo "TMPDIR=$TMPDIR"
            python3 -c "import tempfile; print('gettempdir:', tempfile.gettempdir())"
            echo "=== bwrap isolation probe (argv_prefix topology) ==="
            tmpdir=$(mktemp -d)
            bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --bind "$tmpdir" /tmp/workspace --unshare-net --unshare-pid --unshare-ipc --unshare-uts --new-session --die-with-parent --chdir /tmp/workspace -- /bin/sh -c 'echo probe > .probe && cat .probe' 2>&1
            echo "probe exit: $?"
            rm -rf "$tmpdir"
          } > diagnostics/linux-bwrap-pre.txt
          exit 0
      - name: Run real bwrap isolation E2E
        env:
          # These tests exercise the real kernel/mount/seccomp boundary with
          # direct backend requests.  The production authority receipt path
          # is tested separately by the authority/closure jobs; explicit
          # development mode is required here so the isolation fixture does
          # not pretend that a raw request is an approved production step.
          KHAOS_DEV_MODE: "1"
          KHAOS_EXEC_LAUNCHER: ${{ github.workspace }}/rust/khaos-core/target/release/khaos-exec-launcher
          KHAOS_CGROUP_ROOT: /sys/fs/cgroup/khaos/workloads
          KHAOS_SANDBOX_LAUNCHER: ${{ github.workspace }}/rust/khaos-core/target/release/khaos-sandbox-launcher
        run: |
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          python_bin="$(command -v python)"
          runner_home="$HOME"
          runner_path="$PATH"
          runner_ld_library_path="${LD_LIBRARY_PATH:-}"
          launcher="$KHAOS_SANDBOX_LAUNCHER"
          sudo bash -c '
            echo "$$" > /sys/fs/cgroup/khaos/runner/cgroup.procs
            exec setpriv --reuid="$1" --regid="$2" --init-groups \
              env HOME="$4" PATH="$5" LD_LIBRARY_PATH="$7" \
              TMPDIR=/mnt/khaos-sandbox-workspace \
              KHAOS_DEV_MODE=1 \
              KHAOS_CGROUP_ROOT=/sys/fs/cgroup/khaos/workloads \
              KHAOS_SANDBOX_LAUNCHER="$6" \
              "$3" -m pytest python/tests/coding/test_platform_backends.py \
              -q -k real_bwrap -v
          ' bash "$runner_uid" "$runner_gid" "$python_bin" \
            "$runner_home" "$runner_path" "$launcher" "$runner_ld_library_path"
      - name: Capture post-test diagnostics
        if: always()
        run: |
          set +e
          {
            echo "=== residual bwrap processes ==="
            pgrep -af bwrap 2>&1
            echo "=== residual sleep processes ==="
            pgrep -af "sleep 30" 2>&1
            echo "=== done ==="
          } > diagnostics/linux-bwrap-post.txt
          exit 0
      - name: Remove block-backed sandbox workspace
        if: always()
        run: |
          sudo umount /mnt/khaos-sandbox-workspace || true
          sudo rm -f /var/tmp/khaos-sandbox-workspace.img
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-bwrap-diagnostics
          path: diagnostics/

  # ─── Batch 6.6 (round-6 §6.6): real-kernel browser isolation E2E ────
  # This job validates the explicitly development-only legacy kernel
  # primitives against the real nft/netns/cgroup APIs. Production authority
  # is proven exclusively by fullstack-browser-kernel below, where non-root
  # Python talks to the root-owned Rust helper.
  browser-kernel-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install nftables + iproute2 + nsenter
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 util-linux
          nft --version
          ip -V
          which nsenter
      - name: Enable unprivileged user namespaces (if restricted by AppArmor)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Delegate cgroup v2 subtree for browser cgroup leaves
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers
          for controller in cpu memory pids io; do
            if grep -qw "$controller" /sys/fs/cgroup/cgroup.controllers; then
              echo "+$controller" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
            fi
          done
          sudo mkdir -p /sys/fs/cgroup/khaos-browser
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/khaos-browser
          for controller in cpu memory pids io; do
            if grep -qw "$controller" /sys/fs/cgroup/khaos-browser/cgroup.controllers; then
              echo "+$controller" > /sys/fs/cgroup/khaos-browser/cgroup.subtree_control
            fi
          done
          test -w /sys/fs/cgroup/khaos-browser
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Capture pre-test kernel diagnostics
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "=== uname ==="; uname -a
            echo "=== nft version ==="; nft --version
            echo "=== existing netns ==="; ip netns list
            echo "=== existing nft tables ==="; nft list tables
            echo "=== uid ==="; id
            echo "=== cap_net_admin probe ==="
            # ip netns add/delete is the canonical CAP_NET_ADMIN probe.
            ip netns add khaos-cap-probe 2>&1; echo "add exit: $?"
            ip netns del khaos-cap-probe 2>&1; echo "del exit: $?"
          } > diagnostics/browser-kernel-pre.txt
          exit 0
      - name: Run development-only kernel primitive tests (as root)
        env:
          # Direct privileged Python primitives are reachable only in the
          # explicitly selected development mode.
          KHAOS_DEV_MODE: "1"
          KHAOS_RUN_KERNEL_BROWSER_E2E: "1"
          KHAOS_CGROUP_ROOT: /sys/fs/cgroup/khaos-browser
        # Batch 9.7a (round-9 §十七): this job previously ran
        # test_browser_fullstack_kernel_round8.py with -m "kernel_real and
        # browser_real", but it only set KHAOS_RUN_KERNEL_BROWSER_E2E=1
        # (not KHAOS_RUN_BROWSER_E2E=1), so the round8 _require_fullstack()
        # gate called pytest.skip() — the required job was green but empty.
        # This is supplementary parser/primitive coverage, not production
        # isolation evidence.
        run: |
          python_bin="$(command -v python)"
          py_path="$PYTHONPATH"
          sudo --preserve-env=KHAOS_DEV_MODE,KHAOS_RUN_KERNEL_BROWSER_E2E,KHAOS_CGROUP_ROOT,PYTHONPATH \
            "$python_bin" -m pytest \
            python/tests/security/test_browser_kernel_isolation_round6.py \
            -m kernel_real -v
      - name: Capture post-test kernel diagnostics
        if: always()
        run: |
          set +e
          {
            echo "=== residual netns ==="; ip netns list
            echo "=== residual nft tables ==="; nft list tables
            echo "=== residual cgroup khaos-browser ==="; ls -la /sys/fs/cgroup/khaos-browser 2>&1
            echo "=== done ==="
          } > diagnostics/browser-kernel-post.txt
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-kernel-diagnostics
          path: diagnostics/

  # ─── Batch 7.5 (round-7 §十三): full-stack browser kernel CI ───────
  # The ONE job that proves the FULL production stack together: real
  # Chromium + real BrowserManager + production require_os_sandbox + real
  # nft + real authenticated proxy + real cgroup PID enforcement.  This
  # closes review §十三 ("声明强于实际测试"): the kernel job tests nft/
  # netns without Chromium, and the browser job tests Chromium in dev
  # mode — neither proves the combination.  This job does.
  fullstack-browser-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install nftables + iproute2 + bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 util-linux bubblewrap libcap2-bin
          nft --version
          ip -V
      - name: Enable unprivileged user namespaces (if restricted)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Delegate cgroup v2 subtree
        run: |
          for controller in cpu memory pids io; do
            if grep -qw "$controller" /sys/fs/cgroup/cgroup.controllers; then
              echo "+$controller" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
            fi
          done
          sudo mkdir -p /sys/fs/cgroup/khaos-browser
          sudo chown root:root /sys/fs/cgroup/khaos-browser
          sudo chmod 0755 /sys/fs/cgroup/khaos-browser
          for controller in cpu memory pids io; do
            if grep -qw "$controller" /sys/fs/cgroup/khaos-browser/cgroup.controllers; then
              echo "+$controller" | sudo tee /sys/fs/cgroup/khaos-browser/cgroup.subtree_control >/dev/null
            fi
          done
          # Keep the test runner out of the delegated workloads subtree.
          # The sibling-leaf topology satisfies cgroup v2's no-internal-
          # process rule and lets the launcher atomically move Chromium into
          # its constrained per-browser child without weakening enforcement.
          sudo mkdir -p /sys/fs/cgroup/khaos-browser/runner /sys/fs/cgroup/khaos-browser/workloads
          sudo chown root:root /sys/fs/cgroup/khaos-browser/runner /sys/fs/cgroup/khaos-browser/workloads
          sudo chmod 0755 /sys/fs/cgroup/khaos-browser/runner /sys/fs/cgroup/khaos-browser/workloads
          for controller in cpu memory pids io; do
            if grep -qw "$controller" /sys/fs/cgroup/khaos-browser/workloads/cgroup.controllers; then
              echo "+$controller" | sudo tee /sys/fs/cgroup/khaos-browser/workloads/cgroup.subtree_control >/dev/null
            fi
          done
          sudo test -w /sys/fs/cgroup/khaos-browser/runner/cgroup.procs
          sudo test -w /sys/fs/cgroup/khaos-browser/workloads/cgroup.procs
          sudo test -w /sys/fs/cgroup/khaos-browser/workloads/cgroup.subtree_control
      - name: Build browser kernel TCB (Rust)
        run: |
          cargo build --locked --release --no-default-features \
            --bin khaos-exec-launcher \
            --bin khaos-sandbox-launcher \
            --bin khaos-browser-kernel-helper \
            --manifest-path rust/khaos-core/Cargo.toml
      - name: Harden browser launcher ownership (root-owned, like Chromium)
        # Batch 9.3 + 11.3: the TCB validation requires the launcher
        # binary AND its parent directory chain be owned by the UID that
        # runs it (root in the fullstack test).  cargo builds under
        # /home/runner (uid 1001); copy the binary to /usr/local/bin
        # (root-owned directory chain) so the parent-chain validation
        # passes when the test runs as root.
        run: |
          sudo cp rust/khaos-core/target/release/khaos-sandbox-launcher /usr/local/bin/khaos-sandbox-launcher
          sudo chown root:root /usr/local/bin/khaos-sandbox-launcher
          sudo chmod 0755 /usr/local/bin/khaos-sandbox-launcher
          sudo setcap cap_sys_admin=ep /usr/local/bin/khaos-sandbox-launcher
          test "$(getcap /usr/local/bin/khaos-sandbox-launcher)" = \
            "/usr/local/bin/khaos-sandbox-launcher cap_sys_admin=ep"
          # Batch 11.3: tighten parent-directory permissions (Ubuntu runners
          # default several system dirs to 0777) so the parent-chain
          # validation accepts the launcher + Chromium runtime paths.
          sudo chmod 0755 /usr/local/bin /usr/local /opt
      - name: Install root kernel helper for the non-root Python runtime
        run: |
          runner_uid="$(id -u)"
          sudo install -o root -g root -m 0755 \
            rust/khaos-core/target/release/khaos-browser-kernel-helper \
            /usr/local/sbin/khaos-browser-kernel-helper
          sudo install -d -o root -g root -m 0755 /var/lib/khaos /run/khaos
          openssl rand -hex 32 | sudo tee /var/lib/khaos/browser-helper.secret >/dev/null
          sudo chown root:root /var/lib/khaos/browser-helper.secret
          sudo chmod 0600 /var/lib/khaos/browser-helper.secret
      - name: Install test + browser dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test --extra browser
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Download Chromium binary
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/khaos-playwright
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /opt/khaos-playwright
          uv run python -m playwright install --with-deps chromium
          sudo chown -R root:root /opt/khaos-playwright
          sudo chmod -R go-w /opt/khaos-playwright
      - name: Run non-root full-stack browser kernel tests
        env:
          # CRITICAL: unset dev-mode + mock-mode so the REAL production
          # path runs (real sandbox, no mock fallback).
          KHAOS_BROWSER_MOCK_MODE: ""
          KHAOS_DEV_MODE: "0"
          KHAOS_RUN_BROWSER_E2E: "1"
          KHAOS_RUN_KERNEL_BROWSER_E2E: "1"
          KHAOS_CGROUP_ROOT: /sys/fs/cgroup/khaos-browser/workloads
          KHAOS_BROWSER_HELPER_CGROUP_ROOT: /sys/fs/cgroup/khaos-browser/workloads
          # Batch 11.3: point to the root-owned copy in /usr/local/bin so
          # the parent-chain validation (root-owned /usr/local/bin → /usr/
          # local → /usr → /) passes when the test runs as root.
          KHAOS_SANDBOX_LAUNCHER: /usr/local/bin/khaos-sandbox-launcher
          KHAOS_BROWSER_KERNEL_HELPER_SOCKET: /run/khaos/browser-kernel-helper.sock
          PLAYWRIGHT_BROWSERS_PATH: /opt/khaos-playwright
          # Batch 9.1 (round-9 §九): inject a parent-process secret that
          # MUST NOT reach Chromium's environment.  The negative-secrecy
          # test asserts this sentinel is absent from /proc/<pid>/environ.
          KHAOS_SENTINEL_SECRET: must-not-reach-browser
        run: |
          runner_uid="$(id -u)"
          # Bind the helper to this still-running step shell.  BASHPID is
          # evaluated in the asynchronous sudo list and names the process
          # that immediately becomes root, so it cannot satisfy the helper's
          # non-root UID check.  The pytest clients remain descendants of $$.
          sudo nohup env \
            KHAOS_BROWSER_KERNEL_HELPER_UID="$runner_uid" \
            KHAOS_BROWSER_KERNEL_HELPER_CLIENT_PID="$$" \
            KHAOS_BROWSER_KERNEL_HELPER_SOCKET=/run/khaos/browser-kernel-helper.sock \
            KHAOS_BROWSER_HELPER_SECRET_FILE=/var/lib/khaos/browser-helper.secret \
            KHAOS_BROWSER_HELPER_CGROUP_ROOT=/sys/fs/cgroup/khaos-browser/workloads \
            /usr/local/sbin/khaos-browser-kernel-helper \
            >/tmp/khaos-browser-kernel-helper.log 2>&1 &
          for attempt in $(seq 1 50); do
            test -S /run/khaos/browser-kernel-helper.sock && break
            sleep 0.1
          done
          if ! test -S /run/khaos/browser-kernel-helper.sock; then
            sudo cat /tmp/khaos-browser-kernel-helper.log
            exit 1
          fi
          test "$(stat -c %u /run/khaos/browser-kernel-helper.sock)" = "$runner_uid"
          test "$(stat -c %a /run/khaos/browser-kernel-helper.sock)" = "600"
          test "$(id -u)" != "0"
          test "$(awk '/^CapEff:/ {print $2}' /proc/self/status)" = "0000000000000000"
          python -m pytest \
            python/tests/security/test_browser_fullstack_kernel_round8.py \
            python/tests/security/test_browser_negative_secrecy_round9.py \
            python/tests/security/test_browser_fs_probe_round10.py \
            -m kernel_real -v --log-cli-level=INFO
      - name: Capture non-root browser production evidence
        run: |
          mkdir -p diagnostics
          python scripts/build_security_closure_evidence.py browser-fragment \
            --launcher /usr/local/bin/khaos-sandbox-launcher \
            --helper /usr/local/sbin/khaos-browser-kernel-helper \
            --helper-socket /run/khaos/browser-kernel-helper.sock \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --job browser-non-root-fullstack \
            --output diagnostics/browser-production-fragment.json
          cp /tmp/khaos-browser-kernel-helper.log diagnostics/helper.log
          printf 'uid=%s\ncap_eff=%s\nhelper_socket_uid=%s\n' \
            "$(id -u)" \
            "$(awk '/^CapEff:/ {print $2}' /proc/self/status)" \
            "$(stat -c %u /run/khaos/browser-kernel-helper.sock 2>/dev/null || echo missing)" \
            > diagnostics/non-root-browser-evidence.txt
      - name: Upload non-root browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-non-root-evidence
          path: diagnostics/
          retention-days: 90

  macos-sandbox-security:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build native execution launcher
        run: |
          cargo build --locked --release --no-default-features \
            --bin khaos-exec-launcher \
            --manifest-path rust/khaos-core/Cargo.toml
          echo "KHAOS_EXEC_LAUNCHER=$GITHUB_WORKSPACE/rust/khaos-core/target/release/khaos-exec-launcher" >> "$GITHUB_ENV"
      - name: Capture pre-test diagnostics
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "=== uname ==="
            uname -a
            echo "=== sandbox-exec ==="
            which sandbox-exec
            sandbox-exec --version 2>&1
          } > diagnostics/macos-sandbox-pre.txt
          exit 0
      - name: Run real sandbox-exec isolation E2E
        env:
          # See the Linux real-isolation job: this is direct kernel/Seatbelt
          # evidence, while production receipt binding is covered separately.
          KHAOS_DEV_MODE: "1"
        run: python -m pytest python/tests/coding/test_platform_backends.py -q -k real_macos -v
      - name: Capture post-test diagnostics
        if: always()
        run: |
          set +e
          {
            echo "=== residual sandbox-exec processes ==="
            pgrep -af sandbox-exec 2>&1
            echo "=== done ==="
          } > diagnostics/macos-sandbox-post.txt
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-sandbox-diagnostics
          path: diagnostics/

  windows-fail-closed-security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
      - name: Build native Windows sandbox helper
        shell: pwsh
        run: cargo build --locked --release --no-default-features --bin khaos-windows-sandbox --manifest-path rust/khaos-core/Cargo.toml
      - name: Require native Windows sandbox evidence
        shell: pwsh
        run: |
          "KHAOS_WINDOWS_SANDBOX_HELPER=$env:GITHUB_WORKSPACE\rust\khaos-core\target\release\khaos-windows-sandbox.exe" >> $env:GITHUB_ENV
          "KHAOS_REQUIRE_WINDOWS_NATIVE=1" >> $env:GITHUB_ENV
          "KHAOS_WINDOWS_SANDBOX_TRACE=1" >> $env:GITHUB_ENV
      - name: Prove Windows native sandbox has no Host fallback
        shell: pwsh
        run: uv run python -m pytest python/tests/coding/test_windows_fail_closed.py python/tests/coding/test_backend_selector.py -q -m windows_fail_closed -v
      - name: Capture Windows diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Get-ComputerInfo | Out-File diagnostics/windows-platform.txt
          Get-Process | Sort-Object ProcessName | Format-Table -AutoSize | Out-File diagnostics/windows-processes.txt
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-fail-closed-diagnostics
          path: diagnostics/
