name: Product Integrity Gate

# P1-3 (review): the Security Closure Gate proves the security-critical test
# subset passes, but it does NOT prove the whole product test suite is green.
# A hand-picked contract matrix and the security/ subdirectory alone cannot
# catch non-security regressions (new tests forgotten in the workflow, feature
# regressions that don't touch security, pre-existing-failure debt accruing).
#
# This workflow is the independent whole-repository merge authority for
# *product* integrity: it runs the FULL Python, Go and Rust suites across the
# supported Python version matrix, separately from the security closure.
#
# Relationship to Security Closure Gate: both are required. Security Closure
# proves the security boundary holds; Product Integrity proves the product as
# a whole is not regressed. Neither substitutes for the other.

permissions:
  contents: read

concurrency:
  group: product-integrity-${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel an in-flight full-suite run — the Python product suite takes
  # ~15-30 min per cell and a cancel mid-suite wastes the work already done and
  # leaves the gate red on a non-code infra cancellation.
  cancel-in-progress: false

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "codex/**"]
  workflow_dispatch:

jobs:
  # ─── Full Python product suite across the supported version matrix ──────
  python-product:
    name: Python Product Suite
    runs-on: ${{ matrix.os }}
    # The full 3800-test suite can take ~30-40 min on a slow shared runner
    # (Ubuntu 3.11 was hitting the 45-min ceiling). Give it headroom so the
    # cell completes rather than being force-cancelled mid-suite.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11". CI previously fixed
        # 3.11 only, so 3.12/3.13 were claimed-supported but never tested.
        #
        # The full product suite is required on both supported desktop
        # platforms.  Linux remains the production deployment target; the
        # macOS cell prevents the separate security-contract matrix from
        # masking product regressions in the desktop build.
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          # The full product suite spans TUI (rich/textual), tree-sitter
          # (coding intelligence parse/re-export evidence) and core tests.
          # Install every extra the suite touches so tests that genuinely
          # need an optional dependency run rather than aborting collection.
          # Browser E2E tests are gated by KHAOS_RUN_BROWSER_E2E=1 and skip
          # without it, so the browser extra is not installed here.
          uv sync --frozen --extra test --extra tui --extra tree-sitter
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run FULL Python product suite
        # Deselect tests that need real infrastructure only the dedicated
        # Security Closure Gate jobs provide: a real Docker daemon + pulled
        # images (docker_sandbox_real / production_sandbox_real), a real
        # Chromium binary (browser_real), and a privileged Linux runner with
        # real netns/nft/cgroup-v2 (kernel_real / platform_sandbox_real).
        # Those are covered by docker-security.yml, browser-e2e.yml and
        # platform-sandbox-security.yml respectively.  tree_sitter_real and
        # lsp_real tests DO run here — they only need the optional extras
        # (installed above), not external infrastructure.
        #
        run: >-
          uv run pytest python/tests/ -q
          -m "not browser_real and not docker_sandbox_real and not production_sandbox_real and not kernel_real and not platform_sandbox_real"

  # ─── Full Go product suite with the race detector ──────────────────────
  go-product:
    name: Go Product Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.mod
      - name: Run Go tests with race detector
        working-directory: go
        run: go test -race -count=1 ./...

  # ─── Full Rust product suite ───────────────────────────────────────────
  rust-product:
    name: Rust Product Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Run cargo test (locked, all targets)
        working-directory: rust/khaos-core
        run: cargo test --locked --all-targets
      - name: Run cargo clippy (all targets, warnings as errors)
        working-directory: rust/khaos-core
        run: cargo clippy --all-targets -- -D warnings

  # ─── Aggregate gate ────────────────────────────────────────────────────
  product-integrity-gate:
    name: Product Integrity Gate
    if: always()
    needs:
      - python-product
      - go-product
      - rust-product
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject any non-success dependency
        # Round-11 review Critical-3: a required security gate has only two
        # states — PROVEN or NOT PROVEN.  ``cancelled``/``skipped`` are NOT
        # proven and must block, the same as ``failure``.  Infrastructure
        # instability is solved by reruns, higher timeouts, and
        # cancel-in-progress: false — NEVER by treating an unexecuted test as
        # a pass.
        env:
          PYTHON_PRODUCT: ${{ needs.python-product.result }}
          GO_PRODUCT: ${{ needs.go-product.result }}
          RUST_PRODUCT: ${{ needs.rust-product.result }}
        run: |
          for result in "$PYTHON_PRODUCT" "$GO_PRODUCT" "$RUST_PRODUCT"; do
            test "$result" = "success"
          done
