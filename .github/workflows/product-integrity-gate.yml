name: Product Integrity Gate

# P1-3 (review): the Security Closure Gate proves the security-critical test
# subset passes, but it does NOT prove the whole product test suite is green.
# A hand-picked contract matrix and the security/ subdirectory alone cannot
# catch non-security regressions (new tests forgotten in the workflow, feature
# regressions that don't touch security, pre-existing-failure debt accruing).
#
# This workflow is the independent whole-repository merge authority for
# *product* integrity: it runs the FULL Python, Go and Rust suites across the
# supported Python version matrix, separately from the security closure.
#
# Relationship to Security Closure Gate: both are required. Security Closure
# proves the security boundary holds; Product Integrity proves the product as
# a whole is not regressed. Neither substitutes for the other.

permissions:
  contents: read

concurrency:
  group: product-integrity-${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel an in-flight full-suite run — the Python product suite takes
  # ~15-30 min per cell and a cancel mid-suite wastes the work already done and
  # leaves the gate red on a non-code infra cancellation.
  cancel-in-progress: false

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "codex/**"]
  workflow_dispatch:

jobs:
  # ─── Full Python product suite across the supported version matrix ──────
  python-product:
    name: Python Product Suite
    runs-on: ${{ matrix.os }}
    # The full 3800-test suite can take ~30-40 min on a slow shared runner;
    # macOS arm64 is materially slower when the native launcher stages and
    # signs executable authorities for process-backed tests.  Give the full
    # matrix enough headroom to finish rather than force-cancelling a healthy
    # cell at the old 60-minute ceiling.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11". CI previously fixed
        # 3.11 only, so 3.12/3.13 were claimed-supported but never tested.
        #
        # The full product suite is required on both supported desktop
        # platforms.  Linux remains the production deployment target; the
        # macOS cell prevents the separate security-contract matrix from
        # masking product regressions in the desktop build.
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          # The full product suite spans TUI (rich/textual), tree-sitter
          # (coding intelligence parse/re-export evidence) and core tests.
          # Install every extra the suite touches so tests that genuinely
          # need an optional dependency run rather than aborting collection.
          # Browser E2E tests are gated by KHAOS_RUN_BROWSER_E2E=1 and skip
          # without it, so the browser extra is not installed here.
          uv sync --frozen --extra test --extra tui --extra tree-sitter
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run FULL Python product suite in isolated macOS shards
        if: matrix.os == 'macos-14'
        # Hosted macOS runs have reproduced late-process failures in the
        # HostExecutionBackend tests after thousands of tests pass in one
        # interpreter.  The deterministic runner collects the complete
        # marker-filtered node set first, then runs every node exactly once in
        # fresh serial child processes.  Its historical filename is retained
        # for the Windows job, but its collection/sharding behavior is
        # platform-neutral.
        run: >-
          uv run python scripts/run_windows_product_suite.py --shards 4
          --marker "not browser_real and not docker_sandbox_real and not production_sandbox_real and not kernel_real and not platform_sandbox_real"
      - name: Run FULL Python product suite
        if: matrix.os == 'ubuntu-24.04'
        # Deselect tests that need real infrastructure only the dedicated
        # Security Closure Gate jobs provide: a real Docker daemon + pulled
        # images (docker_sandbox_real / production_sandbox_real), a real
        # Chromium binary (browser_real), and a privileged Linux runner with
        # real netns/nft/cgroup-v2 (kernel_real / platform_sandbox_real).
        # Those are covered by docker-security.yml (including BOTH Docker
        # markers), browser-e2e.yml and platform-sandbox-security.yml
        # respectively.  tree_sitter_real and
        # lsp_real tests DO run here — they only need the optional extras
        # (installed above), not external infrastructure.
        #
        run: >-
          uv run pytest python/tests/ -vv
          -m "not browser_real and not docker_sandbox_real and not production_sandbox_real and not kernel_real and not platform_sandbox_real"

  # Windows is a first-class fail-closed execution target.  Keep one full
  # product cell in this gate so the claim is not limited to the narrow native
  # helper probe in Platform Sandbox Security.  File-tool paths that require
  # POSIX dirfd/process-group/host-managed-launch primitives must fail closed
  # on this runner; they are not silently redirected to a Host backend.  The
  # explicitly marked ``posix_host`` tests are not applicable to Windows and
  # are excluded here so this is an auditable applicability boundary rather
  # than a hidden failure or a silent test drop.  Native Windows coverage is
  # provided by this job and platform-sandbox-security.yml.
  python-product-windows:
    name: Python Product Suite (Windows 3.11)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Windows product dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test --extra tui --extra tree-sitter
          "$env:GITHUB_WORKSPACE/.venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native Windows sandbox helper
        shell: pwsh
        run: cargo build --locked --release --no-default-features --bin khaos-windows-sandbox --manifest-path rust/khaos-core/Cargo.toml
      - name: Require native Windows evidence
        shell: pwsh
        run: |
          "KHAOS_WINDOWS_SANDBOX_HELPER=$env:GITHUB_WORKSPACE\rust\khaos-core\target\release\khaos-windows-sandbox.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KHAOS_REQUIRE_WINDOWS_NATIVE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run FULL Windows Python product suite
        shell: pwsh
        # The runner executes the complete applicable collection, but in
        # isolated processes.  This keeps a leaked asyncio/Winsock/native
        # resource in one shard from starving later tests or hiding the real
        # result behind the 90-minute job timeout.
        run: >-
          uv run python scripts/run_windows_product_suite.py --shards 4
          --marker "not browser_real and not docker_sandbox_real and not production_sandbox_real and not kernel_real and not platform_sandbox_real and not posix_host"
  # ─── Full Go product suite with the race detector ──────────────────────
  go-product:
    name: Go Product Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: go/go.mod
      - name: Run Go tests with race detector
        working-directory: go
        run: go test -race -count=1 ./...

  # ─── Full Rust product suite ───────────────────────────────────────────
  rust-product:
    name: Rust Product Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Run cargo test (locked, all targets)
        working-directory: rust/khaos-core
        run: cargo test --locked --all-targets
      - name: Run cargo clippy (all targets, warnings as errors)
        working-directory: rust/khaos-core
        run: cargo clippy --all-targets -- -D warnings

  # ─── Aggregate gate ────────────────────────────────────────────────────
  product-integrity-gate:
    name: Product Integrity Gate
    if: always()
    needs:
      - python-product
      - python-product-windows
      - go-product
      - rust-product
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject any non-success dependency
        # Round-11 review Critical-3: a required security gate has only two
        # states — PROVEN or NOT PROVEN.  ``cancelled``/``skipped`` are NOT
        # proven and must block, the same as ``failure``.  Infrastructure
        # instability is solved by reruns, higher timeouts, and
        # cancel-in-progress: false — NEVER by treating an unexecuted test as
        # a pass.
        env:
          PYTHON_PRODUCT: ${{ needs.python-product.result }}
          PYTHON_PRODUCT_WINDOWS: ${{ needs.python-product-windows.result }}
          GO_PRODUCT: ${{ needs.go-product.result }}
          RUST_PRODUCT: ${{ needs.rust-product.result }}
        run: |
          for result in "$PYTHON_PRODUCT" "$PYTHON_PRODUCT_WINDOWS" "$GO_PRODUCT" "$RUST_PRODUCT"; do
            test "$result" = "success"
          done
