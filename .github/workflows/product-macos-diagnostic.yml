name: Product macOS Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-product-diagnostic:
    name: Python Product Diagnostic (macos-14, 3.11)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test --extra tui --extra tree-sitter
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run product suite until first macOS failure
        run: >-
          uv run pytest python/tests/ -vv --tb=long --maxfail=1
          -m "not browser_real and not docker_sandbox_real and not production_sandbox_real and not kernel_real and not platform_sandbox_real"
