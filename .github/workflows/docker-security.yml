name: Docker Security E2E

permissions:
  contents: read

concurrency:
  group: docker-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
  workflow_dispatch:

jobs:
  docker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r python/bootstrap-requirements.txt
          uv sync --frozen --extra test
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Preload allowlisted image
        run: docker pull python@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280
      - name: Run real Docker and production sandbox E2E
        env:
          KHAOS_RUN_PRODUCTION_SANDBOX: "1"
        run: python -m pytest python/tests/tools/test_sandbox_tools.py python/tests/coding/test_m4_batch3_1_trusted_verification.py -q -m "docker_sandbox_real or production_sandbox_real" -v

  compose-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Enable unprivileged user namespaces for nested bwrap
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Delegate execution cgroup v2 subtree for production agent
        run: |
          set -euo pipefail
          cgroup_driver="$(docker info --format '{{.CgroupDriver}}')"
          case "$cgroup_driver" in
            systemd)
              # A hyphen-free slice name keeps the delegated parent at the
              # host root instead of making systemd parse a nested slice path.
              cgroup_parent="khaoscompose.slice"
              cgroup_source="/sys/fs/cgroup/khaoscompose.slice"
              ;;
            cgroupfs)
              cgroup_parent="/khaoscompose"
              cgroup_source="/sys/fs/cgroup/khaoscompose"
              ;;
            *)
              echo "unsupported Docker cgroup driver: $cgroup_driver" >&2
              exit 1
              ;;
          esac
          echo "Docker cgroup driver: $cgroup_driver"
          echo "Delegated cgroup parent: $cgroup_parent"
          echo "Delegated cgroup source: $cgroup_source"
          test -f /sys/fs/cgroup/cgroup.controllers
          for controller in cpu memory pids io; do
            grep -qw "$controller" /sys/fs/cgroup/cgroup.controllers
            echo "+$controller" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          done
          sudo mkdir -p "$cgroup_source"
          for controller in cpu memory pids io; do
            grep -qw "$controller" "$cgroup_source/cgroup.controllers"
            echo "+$controller" | sudo tee "$cgroup_source/cgroup.subtree_control" >/dev/null
          done
          # The production image runs the Agent as UID 10001. Delegation must
          # give that exact identity authority to create and configure leaves;
          # the workflow runner itself does not receive this capability.
          sudo chown -R 10001:10001 "$cgroup_source"
          test -f "$cgroup_source/cgroup.controllers"
          test -f "$cgroup_source/cgroup.procs"
          test -f "$cgroup_source/cgroup.subtree_control"
          for controller in cpu memory pids io; do
            grep -qw "$controller" "$cgroup_source/cgroup.controllers"
            grep -qw "$controller" "$cgroup_source/cgroup.subtree_control"
          done
          if [[ -n "$(sudo cat "$cgroup_source/cgroup.procs")" ]]; then
            echo "execution cgroup delegation must start empty" >&2
            exit 1
          fi
          echo "KHAOS_EXECUTION_CGROUP_PARENT=$cgroup_parent" >> "$GITHUB_ENV"
          echo "KHAOS_EXECUTION_CGROUP_SOURCE=$cgroup_source" >> "$GITHUB_ENV"
      - name: Prepare block-backed production workspace
        run: |
          set -euo pipefail
          # Docker named volumes can expose an overlay/pseudo device inside
          # the container. The exact-effect probe must exercise io.max against
          # a real block-backed filesystem, just like the Linux kernel gate.
          sudo truncate -s 2G /var/tmp/khaos-compose-workspace.img
          sudo mkfs.ext4 -F -q /var/tmp/khaos-compose-workspace.img
          sudo mkdir -p /mnt/khaos-compose-workspace
          sudo mount -o loop,noatime /var/tmp/khaos-compose-workspace.img /mnt/khaos-compose-workspace
          # The workflow runner validates the source before Compose starts,
          # while the container Agent writes it as UID/GID 10001. Keep the
          # runner as owner and grant only the Agent's exact group access.
          sudo chown "$(id -u):10001" /mnt/khaos-compose-workspace
          sudo chmod 0770 /mnt/khaos-compose-workspace
          test -w /mnt/khaos-compose-workspace
          echo "KHAOS_PRODUCTION_DATA_SOURCE=/mnt/khaos-compose-workspace" >> "$GITHUB_ENV"
      - name: Run Compose development and production E2E
        run: bash scripts/compose-security-e2e.sh
      - name: Upload production composition producer evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-composition-evidence-${{ github.sha }}
          path: |
            producer-evidence/production-composition-proof.json
            producer-evidence/production-composition-proof.junit.xml
            producer-evidence/production-composition-proof.stdout.log
            producer-evidence/production-composition-proof.stderr.log
          if-no-files-found: error
          retention-days: 90
      - name: Upload production lifecycle producer evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-lifecycle-evidence-${{ github.sha }}
          path: producer-evidence/production-lifecycle-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Remove block-backed production workspace
        if: always()
        run: |
          sudo umount /mnt/khaos-compose-workspace || true
          sudo rm -f /var/tmp/khaos-compose-workspace.img
