[package]
name = "khaos-core"
version = "0.1.0"
edition = "2021"
description = "Khaos performance core: token counting and parallel tool execution."
license = "MIT"

[lib]
name = "_khaos_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "fs", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
hmac = "0.13"
sha2 = "0.11"
ed25519-dalek = { version = "2.1", features = ["std"] }
base64 = "0.23"

[features]
default = ["pyo3"]
# When building pure `cargo test` without a Python interpreter, disable pyo3:
#   cargo test --no-default-features
pyo3 = ["dep:pyo3"]

[target.'cfg(windows)'.dependencies]
# The Windows launcher is a native TCB: restricted token + Job Object are
# intentionally kept out of the Python process.  The dependency is target
# gated so POSIX builds do not pull Windows APIs into the Linux/macOS core.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
