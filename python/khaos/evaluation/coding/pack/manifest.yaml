  - scenario_id: review-python-cache-race
    version: 1
    kind: CODE_REVIEW
    difficulty: medium
    repository_fixture: review-python-cache-race
    user_prompt: Review the cache implementation for correctness under concurrent get-or-compute calls. Return structured findings with file, line, category, and the concepts that justify each finding. Do not modify files.
    languages: [python]
    expected_files: []
    forbidden_files: [.env, .khaos]
    tags: [smoke, review, python]
    oracle:
      kind: REVIEW_FINDING
      allow_extra_findings: true
      match_mode: ALL
      required_findings:
        - finding_id: cache-lock
          category: concurrency
          file: src/cache.py
          line: 12
          line_tolerance: 4
          concepts: [lock, compute, duplicate]
          severity: high
