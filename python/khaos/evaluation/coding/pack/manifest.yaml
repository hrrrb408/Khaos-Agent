    kind: FRONTEND_BUG
    difficulty: medium
    repository_fixture: browser-frontend-bug
    user_prompt: Fix the Save interaction so the task status is updated through the semantic button target and remains accessible to browser verification.
    languages: [javascript]
    expected_files: [src/app.html]
    forbidden_files: [.env, .khaos]
    tags: [browser, frontend, bug-fix]
    oracle:
      kind: COMPOSITE
      children:
        - kind: COMMAND
          argv: [python3, .oracle-hidden/verify.py]
          hidden_files: [verify.py]
          network: none
        - kind: DIFF
          required_changed_files: [src/app.html]
          forbidden_changed_files: [.env]
          min_changed_files: 1
          max_changed_files: 2
