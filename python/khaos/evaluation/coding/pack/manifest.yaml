  - scenario_id: review-python-cache-race
    # Version 5 makes the legacy parser's closed finding shape explicit.  The
    # previous wording required fields but did not prohibit an extra prose
    # field, while the parser correctly fails closed on unknown fields.
    version: 5
    kind: CODE_REVIEW
    difficulty: medium
    repository_fixture: review-python-cache-race
    user_prompt: >-
      Review the cache implementation for correctness under concurrent
      get-or-compute calls. Return exactly one JSON object with a findings
      array containing the required finding. The finding must contain only
      category, file, line, concepts, and severity; use category concurrency,
      short exact identifiers from the source for concepts, and ground the
      finding in the source. Do not add summary, description, or any other
      keys. Do not include prose, Markdown, or a code fence, and do not modify
      files.
    languages: [python]
    expected_files: []
    forbidden_files: [.env, .khaos]
    tags: [smoke, review, python]
    oracle:
      kind: REVIEW_FINDING
      allow_extra_findings: true
      match_mode: ALL
      required_findings:
        - finding_id: cache-lock
          category: concurrency
          file: src/cache.py
          line: 7
          line_tolerance: 3
          concepts: [get_or_compute, _values, _compute]
          severity: high
