schema_version: 1
manifest_id: m8-coding-capability-baseline
version: 1
scenarios:
  - scenario_id: bugfix-go-counter
    version: 1
    kind: BUG_FIX
    difficulty: medium
    repository_fixture: bugfix-go-counter
    user_prompt: Fix the counter so a failed decrement cannot make the balance negative, while preserving the public Go API and adding focused coverage.
    languages: [go]
    expected_files: [counter.go, counter_test.go]
    forbidden_files: [.env, .khaos]
    tags: [smoke, bug-fix, go]
    oracle:
      kind: COMPOSITE
      children:
        - kind: COMMAND
          argv: [python3, .oracle-hidden/verify.py]
          hidden_files: [verify.py]
          network: none
        - kind: DIFF
          required_changed_files: [counter.go]
          forbidden_changed_files: [.env]
          min_changed_files: 1
          max_changed_files: 3
          max_insertions: 80
          max_deletions: 40
