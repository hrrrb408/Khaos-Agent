  - scenario_id: p4-readonly-authority
    version: 2
    kind: CODE_REVIEW
    difficulty: medium
    repository_fixture: p4-readonly-authority
    user_prompt: >-
      Perform a bounded read-only repository-understanding review of the small
      authority fixture. Identify the authority definition, its consumer, the
      enforcement boundary, and the invariant connecting those components.
      Report only one JSON object with a findings array containing findings for
      the authority definition, its consumer, and the enforcement boundary; each
      finding must include category, file, and concepts grounded in the files.
      Use read-only tools as needed. When you have enough evidence to answer
      accurately, stop using tools and answer. Do not edit files, run commands,
      access network/browser tools, or use write/test tools.
    limits:
      timeout_seconds: 300
      max_output_bytes: 65536
      max_diff_bytes: 4194304
      max_changed_files: 64
      max_source_files: 16
      max_source_bytes: 4194304
      max_tool_events: 256
      max_model_turns: 12
      max_tool_calls: 24
    languages: [python]
    expected_files: []
    forbidden_files: [.env, .khaos, .oracle-hidden]
    tags: [qualification, p4-v2, read-only, review]
    oracle:
      kind: REVIEW_FINDING
      allow_extra_findings: false
      match_mode: ALL
      required_findings:
        - finding_id: authority-definition
          category: authority-definition
          file: src/authority.py
          concepts: [AuthorityLease, issue_lease, definition]
          severity: medium
        - finding_id: authority-consumer
          category: authority-consumer
          file: src/consumer.py
          concepts: [consume_lease, AuthorityLease, consumer]
          severity: medium
        - finding_id: enforcement-boundary
          category: enforcement-boundary
          file: src/policy.py
          concepts: [require_active, project_id, invariant]
          severity: high
  - scenario_id: p4-readonly-authority-v3
    # Version 5 keeps the public v3 category contract but removes role-label
    # words from the hidden concept oracle.  The task asks for concepts
    # grounded in source files; category already carries the role, so the
    # oracle must require concrete source concepts rather than redundant
    # labels such as "definition" or "invariant".  The enforcement boundary
    # needs only its primary guard symbol; requiring an arbitrary second
    # symbol would reject other source-grounded explanations.
    version: 5
    kind: CODE_REVIEW
    difficulty: medium
    repository_fixture: p4-readonly-authority
    review_category_contract: p4-review-category-v3
    user_prompt: >-
      Perform a bounded read-only repository-understanding review of the small
      authority fixture. Identify three findings: the authority definition,
      its consumer, and the enforcement boundary. The public category enum is
      exactly authority_definition, consumer, or enforcement_boundary. Use
      authority_definition for the code location that establishes or defines
      the authority represented by the finding; use consumer for the code that
      consumes, depends on, or uses that authority; and use
      enforcement_boundary for the code location that checks, enforces, or
      guards use of that authority. Report exactly one JSON object with a
      findings array containing exactly three findings. Each finding must
      include category, file, and concepts grounded in the files. Do not use
      aliases, spaces, hyphens, or camelCase for category values. Use read-only
      tools as needed. When you have enough evidence to answer accurately, stop
      using tools and answer. Do not edit files, run commands, access
      network/browser tools, or use write/test tools.
    limits:
      timeout_seconds: 300
      max_output_bytes: 65536
      max_diff_bytes: 4194304
      max_changed_files: 64
      max_source_files: 16
      max_source_bytes: 4194304
      max_tool_events: 256
      max_model_turns: 12
      max_tool_calls: 24
    languages: [python]
    expected_files: []
    forbidden_files: [.env, .khaos, .oracle-hidden]
    tags: [qualification, p4-v3, read-only, review]
    oracle:
      kind: REVIEW_FINDING
      category_contract: p4-review-category-v3
      allow_extra_findings: false
      match_mode: ALL
      required_findings:
        - finding_id: authority-definition
          category: authority_definition
          file: src/authority.py
          concepts: [AuthorityLease, issue_lease]
          severity: medium
        - finding_id: authority-consumer
          category: consumer
          file: src/consumer.py
          concepts: [consume_lease, AuthorityLease]
          severity: medium
        - finding_id: enforcement-boundary
          category: enforcement_boundary
          file: src/policy.py
          concepts: [require_active]
          severity: high
