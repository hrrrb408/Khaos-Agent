[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khaos"
version = "0.1.0"
description = "Khaos AI Agent platform"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.19",
    "httpx>=0.28",
    "cryptography>=50.0.0",
    "PyYAML>=6",
    "google-re2>=1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
tui = [
    "textual>=0.47",
    "rich>=13",
    "Pillow>=10",
]
# M2: browser E2E extra.  Pulls in Playwright so the security route guard,
# BrowserContext lifecycle and concurrent-session isolation tests can run
# against a real Chromium instance.  The matching browser binaries must
# still be downloaded separately via ``playwright install chromium``.
# B2: pinned to >=1.48 because ``context.route_web_socket()`` (the
# WebSocket bypass closure) was only added in 1.48.  Older builds fail
# closed at runtime via a ``hasattr`` probe in ``_install_route_guard``.
browser = [
    "playwright>=1.48",
]
tree-sitter = [
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
]
lsp = [
    "pyright>=1.1",
]

[tool.setuptools]
package-dir = {"" = "python"}
packages = {find = {where = ["python"]}}
include-package-data = true

[tool.setuptools.package-data]
"khaos.coding.intelligence" = ["queries/**/*.scm"]

[project.scripts]
khaos = "khaos.cli.main:main"
khaos-authorityd = "khaos.security.authorityd_main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["python"]
testpaths = ["python/tests"]
# Exclude the khaos source tree from test collection.  Source modules like
# ``khaos/tools/test_tools.py`` implement Agent-facing tools (e.g. ``test_run``)
# and are not pytest tests, but their ``test_`` prefix would otherwise cause
# pytest to collect them as test functions when invoked from ``python/``.
norecursedirs = [".git", ".venv", "node_modules", "khaos", "rust", "go"]
markers = [
    "security_contract: cross-platform security contract without a real OS sandbox",
    "platform_sandbox_real: requires a real OS-enforced platform sandbox",
    "docker_sandbox_real: requires a real Docker daemon and pinned image",
    "docker_lifecycle_soak: nightly repeated Docker ownership/cleanup soak",
    "windows_fail_closed: proves Windows refuses execution while no backend exists",
    "tree_sitter_real: requires locked Tree-sitter optional dependencies",
    "lsp_real: requires a trusted pre-installed Language Server (never downloaded at test time)",
    "production_sandbox_real: requires a supported production sandbox daemon and pinned image",
    "posix_host: requires POSIX dirfd, process-group, or host-managed-launch semantics; Windows must use native-or-fail-closed coverage",
    # M2: real Playwright + Chromium binaries.  Tests marked with this
    # exercise the live ``context.route`` route guard, BrowserContext
    # lifecycle / refcount, scheme allowlist and concurrent-session
    # isolation.  Skipped automatically when Playwright or the browser
    # binary is missing, and gated by ``KHAOS_RUN_BROWSER_E2E=1`` so
    # local ``pytest`` runs don't require the heavy dependency.
    "browser_real: requires Playwright and downloaded browser binaries",
    # Batch 6.6: real Linux kernel netns/nftables/cgroup-v2 isolation.
    # These tests create real network namespaces, nftables tables and
    # cgroup leaves, so they need CAP_NET_ADMIN + the ip/nft binaries.
    # Skipped automatically unless KHAOS_RUN_KERNEL_BROWSER_E2E=1 is set
    # (the privileged CI job sets it).
    "kernel_real: requires a privileged Linux runner with real netns/nft/cgroup-v2",
]

# P2-6 (review): Pyright type checking for security-critical modules.
# The security-critical paths below use ``strict`` (no implicit Any, full type
# annotations required); the rest of the codebase uses ``basic`` so the gate
# can roll out incrementally without blocking on legacy code.  The CI
# ``Type Check`` workflow runs ``pyright`` and is currently a REPORTING gate
# (not a required merge authority) until the strict modules reach zero errors;
# see ``docs/type-check-rollout.md`` for the promotion plan.
[tool.pyright]
include = ["python/khaos"]
exclude = ["**/__pycache__", "**/.venv", "python/tests"]
pythonVersion = "3.11"

# Batch 15.7 (review §二十八): per-module strict overrides.
#
# Previously these used ``[tool.pyright.overrides.python.khaos.*]`` (nested
# TOML tables) which pyright does NOT recognise — it emitted
# ``Config contains unrecognized setting "overrides"`` and silently fell
# back to ``basic`` for every module, so the "strict" gate was never
# actually enforced.  The correct format is an array-of-tables
# (``[[tool.pyright.overrides]]``) with a ``module`` key whose value is a
# Python import path (``khaos.*``, NOT ``python.khaos.*`` — ``package-dir``
# maps ``python/`` to the import root).
#
# Modules below are the security-critical surface from review §二十八:
#   execution/service.py, execution/supervisor.py, lsp/client.py,
#   browser_egress_proxy.py, browser_tools.py, tools/scheduler.py,
#   tools/registry.py, agent/approval.py, grpc_server.py
# ``browser_egress_proxy.py`` is covered by the ``khaos.security`` override.

# Security-critical modules: strict (full type safety).
[[tool.pyright.overrides]]
module = "khaos.runtime"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportAny = "error"

[[tool.pyright.overrides]]
module = "khaos.security"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"

[[tool.pyright.overrides]]
module = "khaos.permissions"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"

[[tool.pyright.overrides]]
module = "khaos.coding.execution"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"

[[tool.pyright.overrides]]
module = "khaos.coding.intelligence.lsp"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"

[[tool.pyright.overrides]]
module = "khaos.tools"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"

[[tool.pyright.overrides]]
module = "khaos.agent"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"

[[tool.pyright.overrides]]
module = "khaos.grpc_server"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
