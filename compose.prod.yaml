# Explicit network/production profile.  Use this file by itself, or as an
# override with the same project name, only after supplying all secret/cert
# files and a concrete KHAOS_ALLOWED_HOSTS value.
services:
  khaos-authorityd-init:
    build:
      context: .
      target: python-agent
    container_name: khaos-authorityd-init
    user: "0:0"
    entrypoint: ["python", "/usr/local/sbin/khaos-authorityd-key-init.py"]
    command:
      - --key
      - /var/lib/khaos-authorityd/authorityd.pem
      - --public
      - /run/khaos-authorityd/authorityd.pub
      - --uid
      - "10003"
      - --gid
      - "10003"
    volumes:
      - khaos-authority-state:/var/lib/khaos-authorityd
      - khaos-authority-runtime:/run/khaos-authorityd
    restart: "no"

  khaos-authorityd:
    build:
      context: .
      target: python-agent
    container_name: khaos-authorityd
    user: "10003:10003"
    command: ["python", "-m", "khaos.security.authorityd_main"]
    volumes:
      - khaos-authority-state:/var/lib/khaos-authorityd
      - khaos-authority-runtime:/run/khaos-authorityd
      - ${KHAOS_AUDIT_WORM_CA_FILE:?KHAOS_AUDIT_WORM_CA_FILE must point to the WORM CA certificate}:/run/khaos-worm/ca.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - KHAOS_DEV_MODE=0
      - KHAOS_AUTHORITYD_SOCKET=/run/khaos-authorityd/authorityd.sock
      - KHAOS_AUTHORITYD_KEY_PATH=/var/lib/khaos-authorityd/authorityd.pem
      - KHAOS_AUTHORITYD_PUBLIC_KEY_PATH=/run/khaos-authorityd/authorityd.pub
      - KHAOS_AUTHORITYD_SOCKET_MODE=0660
      - KHAOS_AGENT_UID=10001
      - KHAOS_AUTHORITYD_UID=10003
      - KHAOS_JOB_UID=10004
      - KHAOS_EFFECTIVE_POLICY_DIGEST=${KHAOS_EFFECTIVE_POLICY_DIGEST:?KHAOS_EFFECTIVE_POLICY_DIGEST must be compiled for production}
      - KHAOS_AUDIT_WORM_ENDPOINT=${KHAOS_AUDIT_WORM_ENDPOINT:?KHAOS_AUDIT_WORM_ENDPOINT must be an HTTPS WORM endpoint}
      - KHAOS_AUDIT_WORM_TOKEN=${KHAOS_AUDIT_WORM_TOKEN:-}
      - SSL_CERT_FILE=/run/khaos-worm/ca.pem
    depends_on:
      khaos-authorityd-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/khaos-authorityd/authorityd.sock'); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  khaos-agent-init:
    build:
      context: .
      target: python-agent
    container_name: khaos-agent-init
    user: "0:0"
    entrypoint: ["python", "/usr/local/sbin/khaos-agent-secret-init.py"]
    environment:
      - KHAOS_PYTHON_CAPABILITY_FILE=/run/secrets/khaos_python_capability
    secrets:
      - khaos_python_capability
    volumes:
      - khaos-state:/var/lib/khaos
    restart: "no"

  khaos-agent:
    build:
      context: .
      target: python-agent
    container_name: khaos-agent
    volumes:
      - khaos-data:/app/data
      - khaos-state:/var/lib/khaos
      - khaos-runtime:/run/khaos
      - khaos-helper-runtime:/run/khaos-helper:ro
      - khaos-authority-runtime:/run/khaos-authorityd:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - KHAOS_MODE=office
      - KHAOS_DEV_MODE=0
      - KHAOS_PROJECT_ROOT=/app
      - KHAOS_SANDBOX_LAUNCHER=/usr/local/bin/khaos-sandbox-launcher
      - KHAOS_BROWSER_KERNEL_HELPER_SOCKET=/run/khaos-helper/browser-kernel-helper.sock
      - KHAOS_PYTHON_CAPABILITY_FILE=/var/lib/khaos/rpc-capability
      - KHAOS_AUTHORITYD_SOCKET=/run/khaos-authorityd/authorityd.sock
      - KHAOS_AUTHORITYD_PUBLIC_KEY_PATH=/run/khaos-authorityd/authorityd.pub
      - KHAOS_AUTHORITYD_UID=10003
      - KHAOS_AGENT_UID=10001
      - KHAOS_JOB_UID=10004
      - KHAOS_EFFECTIVE_POLICY_DIGEST=${KHAOS_EFFECTIVE_POLICY_DIGEST:?KHAOS_EFFECTIVE_POLICY_DIGEST must be compiled for production}
    depends_on:
      khaos-agent-init:
        condition: service_completed_successfully
      khaos-authorityd:
        condition: service_healthy
    group_add:
      - "10003"
    # The deployment must explicitly provide host-reviewed outer profiles.
    # Docker security_opt uses name=value syntax. The production composition
    # intentionally has no implicit unconfined default and fails closed when
    # any profile is omitted. Do not add SYS_ADMIN here.
    security_opt:
      - "${KHAOS_DOCKER_SECCOMP_OPT:?KHAOS_DOCKER_SECCOMP_OPT must select an approved seccomp profile}"
      - "${KHAOS_DOCKER_APPARMOR_OPT:?KHAOS_DOCKER_APPARMOR_OPT must select an approved AppArmor profile}"
      - "${KHAOS_DOCKER_SYSTEMPATHS_OPT:?KHAOS_DOCKER_SYSTEMPATHS_OPT must select an approved system-path profile}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/khaos/agent.sock'); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  khaos-kernel-helper:
    build:
      context: .
      target: kernel-helper
    container_name: khaos-kernel-helper
    user: "0:0"
    pid: "service:khaos-agent"
    network_mode: "service:khaos-agent"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - KHAOS_BROWSER_KERNEL_HELPER_UID=10001
      - KHAOS_BROWSER_KERNEL_HELPER_CLIENT_PID=1
      - KHAOS_BROWSER_KERNEL_HELPER_SOCKET=/run/khaos-helper/browser-kernel-helper.sock
      - KHAOS_BROWSER_HELPER_SECRET_FILE=/var/lib/khaos/browser-helper.secret
      - KHAOS_BROWSER_HELPER_JOURNAL_ROOT=/run/khaos-helper/journal
      - KHAOS_BROWSER_HELPER_NETNS_ROOT=/run/khaos-helper/netns
      - KHAOS_BROWSER_HELPER_CGROUP_ROOT=/run/khaos-helper/cgroup
    secrets:
      - khaos_browser_helper_secret
    volumes:
      - khaos-helper-runtime:/run/khaos-helper
      - "${KHAOS_BROWSER_HELPER_CGROUP_SOURCE:-/sys/fs/cgroup/khaos-browser}:/run/khaos-helper/cgroup:rw"
      - khaos-helper-netns:/run/khaos-helper/netns
    depends_on:
      khaos-agent:
        condition: service_started
    restart: unless-stopped

  khaos-gateway:
    build:
      context: .
      target: gateway
    container_name: khaos-gateway
    ports:
      - "8443:8443"
    command:
      - khaos-gateway
      - --addr
      - 0.0.0.0:8443
      - --project-root
      - /app
      - --tls-cert
      - /run/secrets/khaos_tls_cert
      - --tls-key
      - /run/secrets/khaos_tls_key
      - --allowed-hosts
      - ${KHAOS_ALLOWED_HOSTS:?KHAOS_ALLOWED_HOSTS must list the trusted HTTP Host names}
    depends_on:
      khaos-agent:
        condition: service_healthy
    environment:
      - KHAOS_PYTHON_AGENT=/run/khaos/agent.sock
      - KHAOS_API_KEY_FILE=/run/secrets/khaos_api_key
      - KHAOS_PROJECT_ROOT=/app
      - KHAOS_PYTHON_CAPABILITY_FILE=/run/secrets/khaos_python_capability
    secrets:
      - source: khaos_python_capability
        target: khaos_python_capability
        mode: "0440"
      - source: khaos_api_key
        target: khaos_api_key
        mode: "0440"
      - source: khaos_tls_cert
        target: khaos_tls_cert
        mode: "0444"
      - source: khaos_tls_key
        target: khaos_tls_key
        mode: "0440"
    volumes:
      - khaos-runtime:/run/khaos:ro
    group_add:
      - "0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  khaos-data:
  khaos-state:
  khaos-runtime:
  khaos-helper-runtime:
  khaos-helper-netns:
  khaos-authority-state:
  khaos-authority-runtime:

secrets:
  khaos_python_capability:
    file: ${KHAOS_PYTHON_CAPABILITY_FILE:-.secrets/python-capability}
  khaos_browser_helper_secret:
    file: ${KHAOS_BROWSER_HELPER_SECRET_FILE:-.secrets/browser-helper-secret}
  khaos_api_key:
    file: ${KHAOS_API_KEY_FILE:-.secrets/gateway-api-key}
  khaos_tls_cert:
    file: ${KHAOS_TLS_CERT_FILE:?KHAOS_TLS_CERT_FILE must point to a PEM certificate}
  khaos_tls_key:
    file: ${KHAOS_TLS_KEY_FILE:?KHAOS_TLS_KEY_FILE must point to a PEM private key}
